<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة مؤسسة بنية الإنشاء المتقدمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#12365a;--blue:#1F4E78;--orange:#E0792B;--orange2:#c8681f;--paper:#e9edf1;--card:#fff;--ink:#15212c;--mut:#5b6a78;--line:#d3dbe3;--red:#b8392b;--green:#23724a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f3b27c;outline-offset:2px}
#root{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:18px 16px 40px}
.banner{background:#fff;border-radius:14px;padding:8px 14px;border:1px solid var(--line)}
.banner img{display:block;width:100%;height:auto;max-height:150px;object-fit:contain}

/* شريط علوي */
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;height:54px;flex:none}
.bar .ttl{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.bar .b{background:rgba(255,255,255,.12);border:0;color:#fff;padding:7px 13px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
.bar .b:hover{background:rgba(255,255,255,.22)}
.bar .b.or{background:var(--orange)}
.bar .b.or:hover{background:var(--orange2)}
.bar .who{font-size:13px;opacity:.85;white-space:nowrap}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:#fff2;white-space:nowrap}
.chip.ro{background:#f7dcd7;color:var(--red)}
.chip.ok{background:#d9efe3;color:var(--green)}
.chip.wait{background:#fff0d9;color:#9a5a10}
.chip.bad{background:#f7dcd7;color:var(--red)}
.chip.nv{background:#e5e9ee;color:var(--mut)}

/* الدخول */
.login{max-width:420px;margin:6vh auto 0;padding:0 16px;width:100%}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:14px}
.panel h2{margin:0 0 4px;font-size:21px;color:var(--navy)}
.panel p.s{margin:0 0 14px;color:var(--mut);font-size:14px}
label.f{display:block;margin-top:12px;font-weight:600;font-size:13.5px;color:var(--navy)}
input.t,select.t{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}
input.t:focus,select.t:focus{border-color:var(--orange);outline:0;box-shadow:0 0 0 3px #f6d5b9}
input.ltr{direction:ltr;text-align:right}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:10px 18px;border-radius:9px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-weight:700}
.btn:hover{background:var(--blue)}
.btn.full{width:100%;margin-top:16px;padding:12px}
.btn.or{background:var(--orange);border-color:var(--orange)}.btn.or:hover{background:var(--orange2)}
.btn.ghost{background:#fff;color:var(--navy)}.btn.ghost:hover{background:#eef3f8}
.btn.warn{background:#fff;color:var(--red);border-color:var(--red)}.btn.warn:hover{background:#fbeceb}
.btn.sm{padding:5px 11px;font-size:13px;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{margin-top:12px;padding:9px 12px;background:#fbeceb;color:var(--red);border-radius:8px;font-size:14px}
.note{margin-top:12px;padding:9px 12px;background:#fff4e6;color:#8a4d0e;border-radius:8px;font-size:14px}
pre.code{direction:ltr;text-align:left;background:#10202f;color:#d6e6f5;padding:12px;border-radius:9px;overflow:auto;font-size:12.5px;max-height:300px;margin:8px 0}

/* الرئيسية */
.hello{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 4px}
.hello h1{margin:0;font-size:26px;font-weight:800;color:var(--navy)}
.hello span{color:var(--mut)}
h3.sec{margin:26px 0 10px;font-size:16px;color:var(--navy)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{position:relative;text-align:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;min-height:150px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--orange);transform:translateY(-2px)}
.tile .ic{width:48px;height:48px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
.tile .ic svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile:hover .ic{background:var(--orange)}
.tile b{font-size:17px;color:var(--navy);line-height:1.3}
.tile small{color:var(--mut);font-size:13.5px;line-height:1.5}
.tile .chip{position:absolute;top:14px;inset-inline-end:14px}
.tile.adm .ic{background:#33495f}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}

/* المستخدمون */
table.u{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.u th{background:var(--navy);color:#fff;padding:10px;text-align:start;font-size:13.5px}
table.u td{padding:10px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tw{overflow-x:auto}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 12px}
.head h1{margin:0;font-size:22px;color:var(--navy);flex:1}

/* التطبيق */
#frameBox{flex:1;position:relative;min-height:0;background:#fff}
#frameBox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.loading{display:grid;place-items:center;height:100%;color:var(--mut)}
.upd{background:#fff4e6;color:#8a4d0e;padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:14px;border-bottom:1px solid #f1d4ad;flex:none}

dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:92vh;box-shadow:0 20px 60px #0006;color:var(--ink)}
dialog::backdrop{background:#10202f88}
dialog form{padding:20px;display:block}
dialog h3{margin:0 0 6px;color:var(--navy);font-size:19px}
dialog .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog .dact{display:flex;gap:10px;margin-top:18px}
.mx{border:1px solid var(--line);border-radius:10px;margin-top:6px}
.mx div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.mx div:first-child{border-top:0}
.mx select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;min-width:150px}
#toast{position:fixed;bottom:18px;inset-inline:0;display:flex;justify-content:center;pointer-events:none;z-index:99}
#toast span{background:var(--ink);color:#fff;padding:9px 18px;border-radius:9px;font-size:14px;box-shadow:0 6px 20px #0004}
@media(max-width:640px){.bar .who{display:none}.hello h1{font-size:22px}dialog .row2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script type="module">/* نسخة الجهاز الواحد: كل البيانات والحسابات في متصفح هذا الجهاز */
const P='bpl:';
const err=(code)=>Object.assign(new Error(code),{code});
const LEGACY={fleet:['fleet-expenses-v1'],cashbook:['cashbook_v1','cashbook_settings'],mustakhlasat:['mustakhlasat-v1'],accounting:['contracting_acc_v1'],finance:['finance-v1'],site:['site_ledger_v1']};
const norm=u=>String(u||'').trim().toLowerCase();
const rj=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const wj=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){throw err('quota')}};
const meta=()=>rj(P+'meta',{setup:false,users:{}});
const wmeta=m=>wj(P+'meta',m);
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function hash(pw,salt){
  try{ if(window.crypto&&crypto.subtle){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')} }catch(e){}
  return 'x'+btoa(unescape(encodeURIComponent(salt+':'+pw)));
}
const strip=u=>{const {salt,hash:h,...r}=u;return r};
const sessionUid=()=>localStorage.getItem(P+'session');
const meUser=()=>{const m=meta(),u=m.users[sessionUid()];return u?{uid:sessionUid(),...u}:null};
const level=(u,id)=>!u||!u.active?null:u.role==='admin'?'edit':(u.apps||{})[id]||null;
let cb=()=>{};
function resolve(){const u=meUser();if(!u){cb(null);return}if(!u.active){localStorage.removeItem(P+'session');cb(null,'inactive');return}cb(strip(u))}
const subs=new Set();const notify=()=>subs.forEach(f=>f());
window.addEventListener('storage',e=>{if(e.key&&e.key.startsWith(P))notify()});
const findByName=(m,un)=>Object.entries(m.users).find(([,u])=>u.username===un);

const BE={configured:true,local:true,
 async setupDone(){return meta().setup},
 onSession(f){cb=f;setTimeout(resolve,0)},
 async bootstrap(username,name,pw){const m=meta();if(m.setup)throw err('setup-locked');const id=uid(),salt=uid();m.setup=true;m.users[id]={username:norm(username),name,role:'admin',active:true,apps:{},salt,hash:await hash(pw,salt)};wmeta(m);localStorage.setItem(P+'session',id);resolve()},
 async login(username,pw){const m=meta();const f=findByName(m,norm(username));if(!f)throw err('nouser');const [id,u]=f;if(u.hash!==await hash(pw,u.salt))throw err('badpass');localStorage.setItem(P+'session',id);resolve()},
 async logout(){localStorage.removeItem(P+'session');cb(null)},
 async changePassword(c,n){const m=meta(),u=m.users[sessionUid()];if(u.hash!==await hash(c,u.salt))throw err('badpass');u.salt=uid();u.hash=await hash(n,u.salt);wmeta(m)},
 subUsers(f){const g=()=>{const m=meta();f(Object.entries(m.users).map(([id,u])=>({uid:id,...strip(u)})))};subs.add(g);g();return()=>subs.delete(g)},
 async createUser({username,name,password,role,apps}){const m=meta();username=norm(username);if(findByName(m,username))throw err('exists');const id=uid(),salt=uid();m.users[id]={username,name,role,active:true,apps:role==='admin'?{}:apps,salt,hash:await hash(password,salt)};wmeta(m);notify();return id},
 async updateUser(id,p){const m=meta();Object.assign(m.users[id],p);wmeta(m);notify()},
 async resetPassword(id,pw){const m=meta(),u=m.users[id];u.salt=uid();u.hash=await hash(pw,u.salt);wmeta(m)},
 async deleteUser(id){const m=meta();delete m.users[id];wmeta(m);notify()},
 async loadApp(id){
  if(!level(meUser(),id))throw err('denied');
  let a=rj(P+'app:'+id,null);
  if(!a){ /* أول فتح: استيراد بيانات النسخ القديمة المحفوظة في نفس المتصفح إن وُجدت */
    a={rev:0,data:{}};
    (LEGACY[id]||[]).forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)a.data[k]=v}catch(e){}});
    if(id==='salary'&&!Object.keys(a.data).length){try{ /* نقل الرواتب والسلف من دفتر الموقع */
      let raw=null;const st=rj(P+'app:site',null);
      if(st&&st.data&&st.data['site_ledger_v1'])raw=st.data['site_ledger_v1'];else raw=localStorage.getItem('site_ledger_v1');
      if(raw){const o=JSON.parse(raw);a.data['salary_ledger_v1']=JSON.stringify({settings:o.settings||{},projects:[],expenses:[],custody:[],employees:o.employees||[],advances:o.advances||[],salary:o.salary||{},ui:{}})}
    }catch(e){}}
    if(Object.keys(a.data).length){a.rev=1;a.by='استيراد تلقائي';if(level(meUser(),id)==='edit')wj(P+'app:'+id,a)}
  }
  return JSON.parse(JSON.stringify(a));
 },
 async saveApp(id,rev,ch,by){
  if(level(meUser(),id)!=='edit')throw err('denied');
  const a=rj(P+'app:'+id,{rev:0,data:{}});
  if(a.rev!==rev&&!(rev===1&&a.rev===0))throw err('conflict');
  for(const k in ch){if(ch[k]===undefined)delete a.data[k];else a.data[k]=ch[k]}
  a.rev=Math.max(a.rev,rev)+1;a.by=by;wj(P+'app:'+id,a);notify();return a.rev;
 },
 subApp(id,f){const g=()=>{const a=rj(P+'app:'+id,{rev:0});f({rev:a.rev,by:a.by||''})};subs.add(g);return()=>subs.delete(g)},
 async extraExport(){const m=meta();return{users:m.users}},
 async extraImport(x){if(x&&x.users){const m=meta();m.setup=true;const me=sessionUid();const keep=m.users[me];m.users=x.users;if(keep&&!m.users[me])m.users[me]=keep;wmeta(m);notify()}}
};
window.BE_PROMISE=Promise.resolve(BE);
</script>

ss=\"btn ghost addrow\" data-add=\"v.maint.rows|m\">+ إضافة 10 صفوف<\/button>`;\n  return h;\n}\nfunction summaryHTML(st){\n  const{v,y}=ctx();let tot=0;\n  let h=`<h2 class=\"st\">الملخص الإجمالي لمصاريف السيارات - خلال السنة ${S.year}<\/h2>\n  <div class=\"info\" style=\"grid-template-columns:repeat(3,1fr)\">${inf('اسم صاحب السيارة','v.owner','text',st)}${inf('رقم السيارة (عربي)','v.arNo','text',st)}${inf('رقم اللوحة (English)','v.plate','text',st)}<\/div>\n  <table class=\"plain\"><thead><tr><th>الشهر<\/th><th>اسم الشيت<\/th><th>إجمالي مصاريف الشهر (ر.س)<\/th><th>حالة البيانات<\/th><\/tr><\/thead><tbody>`;\n  MONTHS.forEach((n,i)=>{const t=monthTotal(y,i);tot+=t;\n    h+=`<tr class=\"${st?'':'click'}\" ${st?'':`data-go=\"m${i}\"`}><td>${n}<\/td><td>${String(i+1).padStart(2,'0')}- ${n}<\/td><td class=\"c\">${money(t)}<\/td><td class=\"c\">${t>0?'<b class=\"ok\">تم التسجيل<\/b>':'مكتمل / فارغ'}<\/td><\/tr>`});\n  h+=`<\/tbody><tfoot><tr class=\"tr\"><td colspan=\"2\">إجمالي المصاريف السنوية الكلية<\/td><td>${money(tot)}<\/td><td><\/td><\/tr><\/tfoot><\/table>`;\n  return h;\n}\nfunction fleetHTML(st){\n  if(!S.vehicles.length)return`<div class=\"empty\"><h3>لا توجد سيارات بعد<\/h3><p>اضغط «إضافة سيارة» لبدء إنشاء شيت خاص بكل سيارة.<\/p><\/div>`;\n  let a=0,b=0;\n  let h=`<h2 class=\"st\">ملخص الأسطول - سنة ${S.year}<\/h2><table class=\"plain\"><thead><tr><th style=\"width:5%\">م<\/th><th>السيارة<\/th><th>رقم اللوحة<\/th><th>مصاريف السنة<\/th><th>تكلفة الصيانة<\/th><th>انتهاء الفحص<\/th><th>انتهاء الرخصة<\/th><\/tr><\/thead><tbody>`;\n  S.vehicles.forEach((v,i)=>{const e=yearTotal(v,S.year),m=maintTotal(v);a+=e;b+=m;\n    h+=`<tr class=\"${st?'':'click'}\" ${st?'':`data-veh=\"${v.id}\"`}><td class=\"c\">${i+1}<\/td><td>${esc(v.label)}<\/td><td class=\"c\">${esc(v.plate||v.arNo||'')}<\/td><td class=\"c\">${money(e)}<\/td><td class=\"c\">${money(m)}<\/td><td class=\"c\">${expTxt(v.inspect)}<\/td><td class=\"c\">${expTxt(v.license)}<\/td><\/tr>`});\n  h+=`<\/tbody><tfoot><tr class=\"tr\"><td colspan=\"3\">الإجمالي<\/td><td>${money(a)}<\/td><td>${money(b)}<\/td><td colspan=\"2\"><\/td><\/tr><\/tfoot><\/table>`;\n  return h;\n}\nfunction expInfo(d){if(!d)return null;const days=Math.floor((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);return days<0?{c:'bad',t:`منتهي منذ ${-days} يوم`}:days<=30?{c:'soon',t:`ينتهي خلال ${days} يوم`}:null}\nfunction expTxt(d){if(!d)return'—';const e=expInfo(d);return fmtDate(d)+(e?` <span class=\"badge ${e.c}\">${e.t}<\/span>`:'')}\nfunction updateBadges(){document.querySelectorAll('[data-exp]').forEach(el=>{const e=expInfo(get('v.'+el.dataset.exp));el.className='badge'+(e?' '+e.c:'');el.textContent=e?e.t:''})}\n\nfunction sheetHTML(vw,st){\n  if(vw==='fleet')return fleetHTML(st);\n  if(vw==='summary')return summaryHTML(st);\n  if(vw==='maint')return maintHTML(st);\n  return monthHTML(+vw.slice(1),st);\n}\nfunction updateTotals(){\n  const{v,y}=ctx();\n  document.querySelectorAll('[data-tot]').forEach(el=>{const k=el.dataset.tot;el.textContent=money(k==='maint'?maintTotal(v):monthTotal(y,+k.slice(1)))});\n  renderTabs(true);\n}\n\nfunction renderToolbar(){\n  const vs=$('#vsel');vs.innerHTML=S.vehicles.length?S.vehicles.map(v=>`<option value=\"${v.id}\">${esc(v.label)}${v.plate?' — '+esc(v.plate):''}<\/option>`).join(''):'<option>— لا توجد سيارات —<\/option>';\n  if(S.active)vs.value=S.active;\n  const ys=new Set([S.year,new Date().getFullYear()-1,new Date().getFullYear(),new Date().getFullYear()+1]);\n  S.vehicles.forEach(v=>Object.keys(v.years||{}).forEach(y=>ys.add(+y)));\n  $('#ysel').innerHTML=[...ys].sort().map(y=>`<option${y===S.year?' selected':''}>${y}<\/option>`).join('');\n  const none=!S.vehicles.length;\n  ['bEdit','bDel','bPrint','bPrintAll'].forEach(id=>$('#'+id).disabled=none&&id!=='bPrint'?true:(id==='bPrint'?false:none));\n  $('#bPrint').disabled=none;\n}\nfunction renderTabs(onlyDots){\n  const t=$('#tabs');\n  if(onlyDots){const v=curV();if(!v)return;const y=yd(v,S.year);t.querySelectorAll('[data-v]').forEach(b=>{if(/^m\\d+$/.test(b.dataset.v))b.classList.toggle('has',monthTotal(y,+b.dataset.v.slice(1))>0)});return}\n  const v=curV();let h=`<button class=\"tab fleet${view==='fleet'?' on':''}\" data-v=\"fleet\">كل السيارات<\/button>`;\n  if(v){const y=yd(v,S.year);\n    h+=`<button class=\"tab${view==='summary'?' on':''}\" data-v=\"summary\">الملخص السنوي<\/button><button class=\"tab${view==='maint'?' on':''}\" data-v=\"maint\">الصيانة التجميعية<\/button>`;\n    MONTHS.forEach((n,i)=>h+=`<button class=\"tab${view==='m'+i?' on':''}${monthTotal(y,i)>0?' has':''}\" data-v=\"m${i}\">${String(i+1).padStart(2,'0')}- ${n}<\/button>`)}\n  t.innerHTML=h;\n}\nfunction renderSheet(){\n  if(!curV()&&view!=='fleet')view='fleet';\n  $('#content').innerHTML=sheetHTML(view,false);\n  if(curV())updateBadges();\n}\nfunction render(){if(!curV()&&S.vehicles.length){S.active=S.vehicles[0].id}if(curV())ensure(curV());renderToolbar();renderTabs();renderSheet()}\n\n// ---- أحداث ----\nlet sv;\n$('#content').addEventListener('input',e=>{const p=e.target.dataset.p;if(!p)return;set(p,e.target.value);\n  if(p.startsWith('v.')){updateBadges();renderToolbar();} updateTotals();clearTimeout(sv);sv=setTimeout(save,250)});\n$('#content').addEventListener('click',e=>{\n  const a=e.target.closest('[data-add]');if(a){const[p,k]=a.dataset.add.split('|');get(p).push(...rows(10,k==='e'?EXP:MNT));save();renderSheet();return}\n  const g=e.target.closest('[data-go]');if(g){view=g.dataset.go;renderTabs();renderSheet();return}\n  const r=e.target.closest('[data-veh]');if(r){S.active=r.dataset.veh;view='summary';save();render()}});\n$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;view=b.dataset.v;renderTabs();renderSheet();window.scrollTo({top:0})});\n$('#vsel').onchange=e=>{S.active=e.target.value;save();render()};\n$('#ysel').onchange=e=>{S.year=+e.target.value;save();render()};\n\nlet editing=null;\nfunction openDlg(v){editing=v;$('#dtitle').textContent=v?'تعديل بيانات السيارة':'إضافة سيارة';\n  $('#d_label').value=v?v.label:'';$('#d_owner').value=v?v.owner:DEFAULT_OWNER;$('#d_ar').value=v?v.arNo:'';$('#d_pl').value=v?v.plate:'';$('#d_ins').value=v?v.inspect:'';$('#d_lic').value=v?v.license:'';$('#dlg').showModal()}\n$('#bAdd').onclick=()=>openDlg(null);\n$('#bEdit').onclick=()=>openDlg(curV());\n$('#dCancel').onclick=()=>$('#dlg').close();\n$('#vform').addEventListener('submit',e=>{\n  if(e.submitter&&e.submitter.value!=='ok')return;\n  const d={label:$('#d_label').value.trim(),owner:$('#d_owner').value.trim(),arNo:$('#d_ar').value.trim(),plate:$('#d_pl').value.trim(),inspect:$('#d_ins').value,license:$('#d_lic').value};\n  if(!d.label)return;\n  if(editing)Object.assign(editing,d);else{const v={id:'v'+Date.now().toString(36),...d,years:{},maint:{rows:rows(30,MNT)}};S.vehicles.push(v);S.active=v.id;view='summary'}\n  save();render()});\n$('#bDel').onclick=()=>{const v=curV();if(!v)return;\n  if(!confirm(`حذف السيارة «${v.label}» وكل بياناتها نهائيًا؟\\nيُنصح بأخذ نسخة احتياطية أولًا.`))return;\n  S.vehicles=S.vehicles.filter(x=>x!==v);S.active=S.vehicles[0]?.id||null;view=S.vehicles.length?'summary':'fleet';save();render()};\n\n// ---- طباعة ----\nlet forced=null;\nconst ALLV=['summary','maint',...MONTHS.map((_,i)=>'m'+i)];\nconst printHTML=vs=>vs.map(vw=>`<section class=\"pp\"><img class=\"ph\" src=\"${LOGO}\" alt=\"\"><div class=\"sheet\">${sheetHTML(vw,true)}<\/div><\/section>`).join('');\nwindow.addEventListener('beforeprint',()=>{$('#printArea').innerHTML=printHTML(forced||[view])});\nwindow.addEventListener('afterprint',()=>{forced=null;$('#printArea').innerHTML=''});\n$('#bPrint').onclick=()=>{forced=null;window.print()};\n$('#bPrintAll').onclick=()=>{if(!curV())return;forced=ALLV;window.print()};\n\n// ---- نسخ احتياطي ----\n$('#bExp').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-cars-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};\n$('#bImp').onclick=()=>$('#fImp').click();\n$('#fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||!Array.isArray(s.vehicles))throw 0;\n  if(!confirm('سيتم استبدال كل البيانات الحالية بالنسخة المحددة. متابعة؟'))return;S=s;view='summary';save();render()}catch(_){alert('الملف غير صالح')}};r.readAsText(f);e.target.value=''};\n\n$('#logo').src=LOGO;\nrender();\nif(!S.vehicles.length)setTimeout(()=>openDlg(null),300);\n<\/script>\n<\/body>\n<\/html>\n","cashbook":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>دفتر العهدة والمصروفات<\/title>\n<style>\n:root{--bg:#f3f5f9;--card:#fff;--ink:#1c2333;--mut:#6b7488;--line:#e3e7ef;--in:#0f9d58;--out:#d93025;--con:#e8710a;--pri:#2457d6;--tax:#7b3fe4}\n*{box-sizing:border-box}\nbody{margin:0;font-family:\"Segoe UI\",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}\nheader{background:var(--pri);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}\nheader h1{margin:0;font-size:19px}\nheader .tools button{background:rgba(255,255,255,.18);color:#fff;border:0;padding:7px 11px;border-radius:8px;cursor:pointer;margin-inline-start:6px;font-size:13px}\nmain{max-width:1100px;margin:auto;padding:16px}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}\n.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}\n.card small{color:var(--mut);display:block;margin-bottom:6px}\n.card b{font-size:21px}\n.big{background:var(--ink);color:#fff}.big small{color:#b9c0d0}\n.pos{color:var(--in)}.neg{color:var(--out)}\n.big b.pos{color:#5b und:var(--con)}\n.del{background:none;border:0;color:var(--out);cursor:pointer;font-size:16px}\n.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}\n.filters select,.filters input{width:auto;min-width:130px}\n.empty{padding:24px;text-align:center;color:var(--mut)}\n.set{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}\n.set div{flex:0 0 150px}\n.plogo{display:none}\n@media print{.plogo{display:block!important;margin-bottom:8px}.plogo img{display:block;width:100%;height:auto}header .tools,.tabs,form,.filters,.del,.set{display:none!important}body{background:#fff}}\n<\/style>\n<\/head>\n<body>\n<div class=\"plogo\"><img id=\"plogoImg\" alt=\"\"><\/div>\n<header>\n  <h1>📒 دفتر العهدة والمصروفات<\/h1>\n  <div class=\"tools\">\n    <button onclick=\"exportCSV()\">تصدير Excel (CSV)<\/button>\n    <button onclick=\"backup()\">نسخة احتياطية<\/button>\n    <button onclick=\"document.getElementById('rf').click()\">استرجاع<\/button>\n    <button onclick=\"window.print()\">طباعة<\/button>\n    <input type=\"file\" id=\"rf\" accept=\".json\" hidden onchange=\"restore(this)\">\n  <\/div>\n<\/header>\n<main>\n  <div class=\"set\">\n    <div><label>نسبة الضريبة %<\/label><input type=\"number\" id=\"rate\" step=\"0.01\" min=\"0\" value=\"15\" onchange=\"saveSet()\"><\/div>\n    <div><label>العملة<\/label><input type=\"text\" id=\"cur\" value=\"ريال\" onchange=\"saveSet()\"><\/div>\n  <\/div>\n\n  <div class=\"cards\">\n    <div class=\"card big\"><small>💰 الرصيد المتاح الآن<\/small><b id=\"c-bal\">0<\/b><\/div>\n    <div class=\"card\"><small>إجمالي المستلم من الشركة<\/small><b class=\"pos\" id=\"c-in\">0<\/b><\/div>\n    <div class=\"card\"><small>إجمالي المصروفات<\/small><b class=\"neg\" id=\"c-exp\">0<\/b><\/div>\n    <div class=\"card\"><small>المسلَّم للمقاولين<\/small><b id=\"c-con\" style=\"color:var(--con)\">0<\/b><\/div>\n    <div class=\"card\"><small>إجمالي الضريبة في الفواتير<\/small><b id=\"c-tax\" style=\"color:var(--tax)\">0<\/b><\/div>\n    <div class=\"card\"><small>حركة اليوم (صافي)<\/small><b id=\"c-today\">0<\/b><\/div>\n  <\/div>\n\n  <div class=\"tabs\">\n    <button data-t=\"in\" class=\"on\" onclick=\"setTab('in')\">⬇️ استلام من الشركة<\/button>\n    <button data-t=\"exp\" onclick=\"setTab('exp')\">🧾 مصروف / فاتورة<\/button>\n    <button data-t=\"con\" onclick=\"setTab('con')\">👷 تسليم لمقاول<\/button>\n  <\/div>\n\n  <form id=\"f\" onsubmit=\"return add(event)\">\n    <div class=\"grid\">\n      <div><label>التاريخ والوقت (تلقائي)<\/label><input type=\"datetime-local\" id=\"ts\" required><\/div>\n      <div id=\"g-party\"><label id=\"l-party\">من (اسم الشخص / الجهة)<\/label><input type=\"text\" id=\"party\" list=\"plist\"><\/div>\n      <div id=\"g-amt\"><label id=\"l-amt\">المبلغ<\/label><input type=\"number\" id=\"amt\" step=\"0.01\" min=\"0\" oninput=\"calc()\"><\/div>\n      <div id=\"g-cat\"><label>التصنيف<\/label>\n        <select id=\"cat\"><option>مواد<\/option><option>عمالة<\/option><option>نقل ومواصلات<\/option><option>أكل وشرب<\/option><option>أدوات ومعدات<\/option><option>إيجار<\/option><option>وقود<\/option><option>أخرى<\/option><\/select>\n      <\/div>\n      <div style=\"grid-column:1/-1\"><label>البيان / ملاحظات<\/label><input type=\"text\" id=\"desc\" placeholder=\"مثال: شراء أسمنت / دفعة أولى من المقاول...\"><\/div>\n    <\/div>\n    <datalist id=\"plist\"><\/datalist>\n\n    <div class=\"inv\" id=\"invbox\">\n      <label class=\"chk\"><input type=\"checkbox\" id=\"isinv\" onchange=\"calc()\"> المصروف ده بفاتورة ضريبية<\/label>\n      <div id=\"invfields\" style=\"display:none\">\n        <div class=\"grid\" style=\"margin-top:10px\">\n          <div><label>رقم الفاتورة<\/label><input type=\"text\" id=\"invno\"><\/div>\n          <div><label>طريقة الإدخال<\/label>\n            <select id=\"mode\" onchange=\"calc()\">\n              <option value=\"incl\">المبلغ المدخل = الإجمالي شامل الضريبة<\/option>\n              <option value=\"excl\">المبلغ المدخل = قبل الضريبة (أضيف عليه الضريبة)<\/option>\n            <\/select>\n          <\/div>\n        <\/div>\n        <div class=\"row\">\n          <div><small>الصافي بدون ضريبة<\/small><b id=\"v-net\">0<\/b><\/div>\n          <div><small>قيمة الضريبة (<span id=\"v-rate\">15<\/span>%)<\/small><b id=\"v-tax\">0<\/b><\/div>\n          <div><small>الإجمالي المخصوم من الرصيد<\/small><b id=\"v-tot\">0<\/b><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <button class=\"btn\" id=\"sbtn\">➕ حفظ<\/button>\n  <\/form>\n\n  <h2>سجل الحركات<\/h2>\n  <div class=\"filters\">\n    <select id=\"fType\" onchange=\"render()\"><option value=\"\">كل الأنواع<\/option><option value=\"in\">مستلم<\/option><option value=\"exp\">مصروف<\/option><option value=\"con\">مقاول<\/option><\/select>\n    <input type=\"date\" id=\"fFrom\" onchange=\"render()\" title=\"من تاريخ\">\n    <input type=\"date\" id=\"fTo\" onchange=\"render()\" title=\"إلى تاريخ\">\n    <input type=\"text\" id=\"fQ\" placeholder=\"بحث...\" oninput=\"render()\">\n  <\/div>\n  <div class=\"tablewrap\"><table>\n    <thead><tr><th>التاريخ والوقت<\/th><th>النوع<\/th><th>الجهة<\/th><th>البيان<\/th><th>الصافي<\/th><th>الضريبة<\/th><th>الإجمالي<\/th><th>الرصيد بعدها<\/th><th><\/th><\/tr><\/thead>\n    <tbody id=\"tb\"><\/tbody>\n  <\/table><\/div>\n\n  <h2>ملخص المقاولين<\/h2>\n  <div class=\"tablewrap\"><table style=\"min-width:360px\">\n    <thead><tr><th>المقاول<\/th><th>عدد الدفعات<\/th><th>إجمالي ما استلمه<\/th><th>آخر دفعة<\/th><\/tr><\/thead>\n    <tbody id=\"cb\"><\/tbody>\n  <\/table><\/div>\n\n  <h2>المصروفات حسب التصنيف<\/h2>\n  <div class=\"tablewrap\"><table style=\"min-width:300px\">\n    <thead><tr><th>التصنيف<\/th><th>الإجمالي<\/th><\/tr><\/thead>\n    <tbody id=\"catb\"><\/tbody>\n  <\/table><\/div>\n<\/main>\n\n<script>\nconst KEY='cashbook_v1', SKEY='cashbook_settings';\nlet data=[], tab='in', tsTouched=false;\ntry{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}\nlet set={rate:15,cur:'ريال'};\ntry{set=Object.assign(set,JSON.parse(localStorage.getItem(SKEY)||'{}'))}catch(e){}\nconst $=id=>document.getElementById(id);\nconst n2=v=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst money=v=>n2(v)+' '+set.cur;\nconst r2=v=>Math.round((+v+Number.EPSILON)*100)/100;\nconst nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};\nconst fdt=ts=>new Date(ts).toLocaleString('ar-EG-u-nu-latn',{dateStyle:'short',timeStyle:'short'});\nconst esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nfunction save(){localStorage.setItem(KEY,JSON.stringify(data))}\nfunction saveSet(){set.rate=+$('rate').value||0;set.cur=$('cur').value||'';localStorage.setItem(SKEY,JSON.stringify(set));calc();render()}\n\nfunction setTab(t){\n  tab=t;\n  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));\n  const m={in:['من (اسم الشخص / الجهة)','المبلغ المستلم'],exp:['المورد / المحل','المبلغ'],con:['اسم المقاول','المبلغ المسلَّم']};\n  $('l-party').textContent=m[t][0];$('l-amt').textContent=m[t][1];\n  $('g-cat').style.display=t==='exp'?'':'none';\n  $('invbox').style.display=t==='exp'?'':'none';\n  $('sbtn').style.background={in:'var(--in)',exp:'var(--out)',con:'var(--con)'}[t];\n  if(t==='in'&&!$('party').value)$('party').value='';\n  calc();\n}\nfunction calc(){\n  const r=(+$('rate').value||0)/100, a=+$('amt').value||0;\n  const on=$('isinv').checked && tab==='exp';\n  $('invfields').style.display=on?'block':'none';\n  $('v-rate').textContent=$('rate').value||0;\n  let net=a,tax=0,tot=a;\n  if(on){\n    if($('mode').value==='incl'){tot=a;net=r2(a/(1+r));tax=r2(a-net)}\n    else{net=a;tax=r2(a*r);tot=r2(a+tax)}\n  }\n  $('v-net').textContent=money(net);$('v-tax').textContent=money(tax);$('v-tot').textContent=money(tot);\n  return {net,tax,tot,inv:on};\n}\nfunction add(e){\n  e.preventDefault();\n  const a=+$('amt').value;\n  if(!(a>0)){alert('اكتب مبلغ أكبر من صفر');return false}\n  const c=calc();\n  const row={id:Date.now()+Math.random(),type:tab,ts:$('ts').value||nowLocal(),\n    party:$('party').value.trim(),desc:$('desc').value.trim(),\n    cat:tab==='exp'?$('cat').value:'',invoice:c.inv,invNo:c.inv?$('invno').value.trim():'',\n    net:c.net,tax:c.tax,total:c.tot};\n  data.push(row);save();\n  $('amt').value='';$('desc').value='';$('invno').value='';$('isinv').checked=false;\n  tsTouched=false;$('ts').value=nowLocal();\n  if(tab==='exp')$('party').value='';\n  calc();render();\n  return false;\n}\nfunction del(id){\n  if(!confirm('تحذف الحركة دي؟'))return;\n  data=data.filter(x=>x.id!==id);save();render();\n}\nconst sign=t=>t==='in'?1:-1;\nconst names={in:'مستلم',exp:'مصروف',con:'مقاول'};\n\nfunction render(){\n  const sorted=[...data].sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:a.id-b.id);\n  let run=0;const bal=new Map();\n  sorted.forEach(x=>{run=r2(run+sign(x.type)*x.total);bal.set(x.id,run)});\n  const sum=t=>r2(data.filter(x=>x.type===t).reduce((s,x)=>s+x.total,0));\n  const inn=sum('in'),exp=sum('exp'),con=sum('con');\n  const tax=r2(data.filter(x=>x.invoice).reduce((s,x)=>s+x.tax,0));\n  const balance=r2(inn-exp-con);\n  $('c-in').textContent=money(inn);$('c-exp').textContent=money(exp);$('c-con').textContent=money(con);\n  $('c-tax').textContent=money(tax);\n  const cb=$('c-bal');cb.textContent=money(balance);cb.className=balance>=0?'pos':'neg';\n  const today=new Date().toLocaleDateString('en-CA');\n  const tn=r2(data.filter(x=>x.ts.slice(0,10)===today).reduce((s,x)=>s+sign(x.type)*x.total,0));\n  const ct=$('c-today');ct.textContent=money(tn);ct.className=tn>=0?'pos':'neg';\n\n  const ft=$('fType').value,ff=$('fFrom').value,fto=$('fTo').value,q=$('fQ').value.trim();\n  let list=sorted.filter(x=>(!ft||x.type===ft)&&(!ff||x.ts.slice(0,10)>=ff)&&(!fto||x.ts.slice(0,10)<=fto)&&\n    (!q||(x.party+' '+x.desc+' '+x.cat+' '+x.invNo).includes(q))).reverse();\n  $('tb').innerHTML=list.length?list.map(x=>`<tr>\n    <td>${fdt(x.ts)}<\/td>\n    <td><span class=\"tag ${x.type}\">${names[x.type]}<\/span>${x.invoice?' <span class=\"tag\" style=\"background:var(--tax)\">فاتورة'+(x.invNo?' '+esc(x.invNo):'')+'<\/span>':''}<\/td>\n    <td>${esc(x.party)||'—'}<\/td>\n    <td>${esc(x.desc)||'—'}${x.cat?'<br><small style=\"color:var(--mut)\">'+esc(x.cat)+'<\/small>':''}<\/td>\n    <td>${x.invoice?n2(x.net):'—'}<\/td>\n    <td>${x.invoice?n2(x.tax):'—'}<\/td>\n    <td style=\"font-weight:700;color:${x.type==='in'?'var(--in)':'var(--out)'}\">${x.type==='in'?'+':'−'}${n2(x.total)}<\/td>\n    <td>${n2(bal.get(x.id))}<\/td>\n    <td><button class=\"del\" onclick=\"del(${x.id})\" title=\"حذف\">🗑<\/button><\/td><\/tr>`).join('')\n    :'<tr><td colspan=\"9\" class=\"empty\">لا توجد حركات بعد<\/td><\/tr>';\n\n  const cm={};\n  data.filter(x=>x.type==='con').forEach(x=>{const k=x.party||'(بدون اسم)';(cm[k]=cm[k]||{n:0,t:0,l:''});cm[k].n++;cm[k].t=r2(cm[k].t+x.total);if(x.ts>cm[k].l)cm[k].l=x.ts});\n  const ck=Object.keys(cm);\n  $('cb').innerHTML=ck.length?ck.map(k=>`<tr><td>${esc(k)}<\/td><td>${cm[k].n}<\/td><td><b>${money(cm[k].t)}<\/b><\/td><td>${fdt(cm[k].l)}<\/td><\/tr>`).join('')\n    :'<tr><td colspan=\"4\" class=\"empty\">لا توجد دفعات للمقاولين<\/td><\/tr>';\n\n  const cc={};data.filter(x=>x.type==='exp').forEach(x=>{cc[x.cat||'أخرى']=r2((cc[x.cat||'أخرى']||0)+x.total)});\n  const ckk=Object.keys(cc);\n  $('catb').innerHTML=ckk.length?ckk.map(k=>`<tr><td>${esc(k)}<\/td><td>${money(cc[k])}<\/td><\/tr>`).join(''):'<tr><td colspan=\"2\" class=\"empty\">—<\/td><\/tr>';\n\n  const names2=[...new Set(data.map(x=>x.party).filter(Boolean))];\n  $('plist').innerHTML=names2.map(v=>`<option value=\"${esc(v)}\">`).join('');\n}\nfunction dl(name,content,type){\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();\n}\nfunction exportCSV(){\n  const rows=[['التاريخ والوقت','النوع','الجهة','البيان','التصنيف','رقم الفاتورة','الصافي','الضريبة','الإجمالي']];\n  [...data].sort((a,b)=>a.ts<b.ts?-1:1).forEach(x=>rows.push([x.ts.replace('T',' '),names[x.type],x.party,x.desc,x.cat,x.invNo,x.invoice?x.net:'',x.invoice?x.tax:'',x.total]));\n  dl('cashbook.csv','\\ufeff'+rows.map(r=>r.map(c=>'\"'+String(c??'').replace(/\"/g,'\"\"')+'\"').join(',')).join('\\n'),'text/csv');\n}\nfunction backup(){dl('cashbook-backup-'+nowLocal().slice(0,10)+'.json',JSON.stringify({data,set}),'application/json')}\nfunction restore(inp){\n  const f=inp.files[0];if(!f)return;\n  const rd=new FileReader();\n  rd.onload=()=>{try{\n    const o=JSON.parse(rd.result);\n    if(!Array.isArray(o.data))throw 0;\n    if(!confirm('هيتم استبدال البيانات الحالية بالنسخة الاحتياطية. متأكد؟'))return;\n    data=o.data;if(o.set)set=Object.assign(set,o.set);\n    save();localStorage.setItem(SKEY,JSON.stringify(set));init();\n  }catch(e){alert('الملف غير صالح')}};\n  rd.readAsText(f);inp.value='';\n}\nfunction init(){\n  $('rate').value=set.rate;$('cur').value=set.cur;\n  $('ts').value=nowLocal();setTab(tab);render();\n}\n$('ts').addEventListener('input',()=>tsTouched=true);\nsetInterval(()=>{if(!tsTouched)$('ts').value=nowLocal()},30000);\ninit();\ntry{if(window.PORTAL_LOGO)document.getElementById('plogoImg').src=window.PORTAL_LOGO}catch(e){}\n<\/script>\n<\/body>\n<\/html>\n","mustakhlasat":"<!doctype html>\n<html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>المستخلصات<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600&display=swap\">\n<style>\n/* Layout: ledger. Right rail = companies > projects. Main = statement table for the selection, with a totals strip on top. */\n:root{\n  --bg:#E8ECEA; --surface:#F8F9F8; --surface2:#EEF1EF; --ink:#17262B; --muted:#5A6A6F; --line:#CDD5D2;\n  --accent:#135D66; --accent-ink:#FFFFFF; --accent-soft:#D3E6E7;\n  --pos:#2B7A4B; --pos-soft:#DCEEE2; --warn:#9A5C14; --warn-soft:#F4E6CF; --neg:#A93F2E; --neg-soft:#F5DDD7;\n  --scrim:rgba(15,25,28,.5);\n  --f-body:\"IBM Plex Sans Arabic\",\"Segoe UI\",Tahoma,system-ui,sans-serif;\n  --f-display:\"Reem Kufi\",\"IBM Plex Sans Arabic\",\"Segoe UI\",Tahoma,sans-serif;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0F1617; --surface:#172022; --surface2:#1D282A; --ink:#E4ECEA; --muted:#93A5A8; --line:#2B3A3D;\n    --accent:#5DB4BC; --accent-ink:#0B1517; --accent-soft:#1E3B3F;\n    --pos:#6CC38B; --pos-soft:#1B3426; --warn:#E0A458; --warn-soft:#3A2D16; --neg:#E88572; --neg-soft:#3D211B;\n    --scrim:rgba(0,0,0,.6); color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0F1617; --surface:#172022; --surface2:#1D282A; --ink:#E4ECEA; --muted:#93A5A8; --line:#2B3A3D;\n  --accent:#5DB4BC; --accent-ink:#0B1517; --accent-soft:#1E3B3F;\n  --pos:#6CC38B; --pos-soft:#1B3426; --warn:#E0A458; --warn-soft:#3A2D16; --neg:#E88572; --neg-soft:#3D211B;\n  --scrim:rgba(0,0,0,.6); color-scheme:dark;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}\nbutton,input,select,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\nbdi{unicode-bidi:isolate}\n\n#app{max-width:1320px;margin-inline:auto;padding-block:20px 40px;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\n.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}\n.brand h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1.1;letter-spacing:.01em}\n.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}\n.cur-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}\n.cur-pick select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}\n\n#banner{display:flex;flex-direction:column;gap:8px;margin-top:14px}\n.note{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:10px 14px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:14px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}\n.note p{margin:0;min-width:0}\n\n.rail-toggle{display:none;width:100%;margin-top:14px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;text-align:start;font-weight:500}\n.shell{display:grid;grid-template-columns:292px minmax(0,1fr);gap:24px;margin-top:18px;align-items:start}\n\n/* rail */\n.rail{min-width:0;position:sticky;top:12px}\n.rail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}\n.rail-head h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:600}\n.all,.co-row,.pj-row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:start;background:none;border:0;padding:9px 10px;border-radius:6px;color:inherit}\n.all:hover,.co-row:hover,.pj-row:hover{background:var(--surface2)}\n.all.on,.co-row.on,.pj-row.on{background:var(--accent);color:var(--accent-ink)}\n.all.on .n,.co-row.on .n,.pj-row.on .n{color:inherit;opacity:.85}\n.nm{min-width:0;overflow-wrap:anywhere;font-weight:500}\n.n{color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}\n.co{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}\n.co.open{background:var(--surface);border-radius:8px;border:1px solid var(--line);padding:4px;margin-block:8px}\n.projects{display:flex;flex-direction:column;gap:2px;padding:2px 0 4px;margin-inline-start:12px;border-inline-start:2px solid var(--line);padding-inline-start:6px}\n.pj-row{font-size:14px;padding:7px 10px}\n.pj-row .nm{font-weight:400}\n.co-tools{display:flex;gap:6px;flex-wrap:wrap;padding:4px 8px 6px}\n.link{background:none;border:0;padding:3px 4px;color:var(--accent);font-size:13px;text-decoration:underline;text-underline-offset:3px}\n.rail-empty{color:var(--muted);font-size:14px;padding:10px}\n\n/* buttons */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;font-weight:500;white-space:nowrap}\n.btn:hover{border-color:var(--muted)}\n.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}\n.btn.primary:hover{filter:brightness(1.08)}\n.btn.sm{padding:5px 11px;font-size:13px}\n.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}\n.btn.danger.sure{background:var(--neg);color:#fff;border-color:var(--neg)}\n\n/* main */\n.main{min-width:0}\n.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}\n.head > div{min-width:0}\n.crumbs{font-size:13px;color:var(--muted)}\n.head h2{margin:2px 0 0;font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}\n.meta{margin:6px 0 0;color:var(--muted);font-size:14px;display:flex;gap:4px 16px;flex-wrap:wrap}\n.meta b{color:var(--ink);font-weight:500}\n.progress{margin-top:12px;max-width:440px}\n.progress .bar{height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}\n.progress .bar i{display:block;height:100%;background:var(--accent)}\n.progress p{margin:5px 0 0;font-size:13px;color:var(--muted)}\n\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:8px}\n.stat{padding:14px 18px;min-width:0;border-inline-start:1px solid var(--line)}\n.stat:first-child{border-inline-start:0}\n.stat span{display:block;font-size:13px;color:va der-radius:6px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}\n\n@media (max-width:899px){\n  .rail-toggle{display:block}\n  .shell{grid-template-columns:minmax(0,1fr);gap:16px;margin-top:12px}\n  .rail{display:none;position:static}\n  .shell.rail-open .rail{display:block}\n  .brand h1{font-size:28px}\n  .head h2{font-size:24px}\n  .stat{border-inline-start:0;border-top:1px solid var(--line)}\n  .stat:first-child{border-top:0}\n  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .stat:nth-child(even){border-inline-start:1px solid var(--line)}\n  .stat:nth-child(2){border-top:0}\n  .sheet{top:auto;bottom:0;margin:0;width:100%;max-height:92%;border-radius:12px 12px 0 0}\n  .pay-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}\n  .pay-row input[name=pnote]{grid-column:1/3;grid-row:2}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n<\/style>\n\n<style>#printArea{display:none}@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff!important;color:#000!important}body>*:not(#printArea){display:none!important}#printArea{display:block}#printArea img.ph{display:block;width:100%;height:auto;margin-bottom:10px}#printArea button{display:none}#printArea .tablewrap{overflow:visible;border:0}#printArea table{min-width:0}#printArea .stats,#printArea .counts{break-inside:avoid}}\nbody{margin:0}[hidden]{display:none!important}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}<\/style>\n<\/head><body>\n<div id=\"app\" dir=\"rtl\" lang=\"ar\">\n  <header class=\"top\">\n    <div class=\"brand\">\n      <h1>المستخلصات<\/h1>\n      <p>الشركات والمشاريع وكل مستخلص بقيمته وخصوماته ودفعاته<\/p>\n    <\/div>\n    <div class=\"tools\">\n      <button class=\"btn sm\" type=\"button\" data-act=\"print\">طباعة<\/button>\n      <button class=\"btn sm\" type=\"button\" data-act=\"backup\">نسخة احتياطية<\/button>\n      <button class=\"btn sm\" type=\"button\" data-act=\"restore\">استرجاع نسخة<\/button>\n      <input type=\"file\" id=\"restoreFile\" accept=\"application/json,.json\" hidden>\n      <label class=\"cur-pick\">العملة\n        <select id=\"cur\" aria-label=\"العملة\"><\/select>\n      <\/label>\n    <\/div>\n  <\/header>\n  <div id=\"banner\"><\/div>\n  <button class=\"rail-toggle\" type=\"button\" data-act=\"toggle-rail\" id=\"railToggle\">الشركات والمشاريع<\/button>\n  <div class=\"shell\" id=\"shell\">\n    <aside class=\"rail\" id=\"rail\" aria-label=\"الشركات والمشاريع\"><\/aside>\n    <main class=\"main\">\n      <section id=\"head\" class=\"head\"><\/section>\n      <section id=\"stats\" class=\"stats\"><\/section>\n      <section id=\"counts\" class=\"counts\"><\/section>\n      <section class=\"toolbar\">\n        <input id=\"q\" type=\"search\" placeholder=\"ابحث برقم المستخلص أو المشروع أو الملاحظات\" aria-label=\"بحث\">\n        <div id=\"chips\" class=\"chips\"><\/div>\n        <button class=\"btn primary\" type=\"button\" data-act=\"add-invoice\">+ مستخلص جديد<\/button>\n        <button class=\"btn\" type=\"button\" id=\"btnExport\" data-act=\"export\" hidden>تصدير CSV<\/button>\n      <\/section>\n      <div id=\"cap\" class=\"cap\"><\/div>\n      <section id=\"results\"><\/section>\n    <\/main>\n  <\/div>\n<\/div>\n<div id=\"sheetRoot\"><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n<div id=\"printArea\"><\/div>\n\n<script>\n(function(){\n'use strict';\ndocument.documentElement.dir='rtl';document.documentElement.lang='ar';\n\n/* ---------- constants ---------- */\nvar KINDS={current:'جاري',final:'ختامي',advance:'دفعة مقدمة',retention:'إفراج ضمان'};\nvar STAGES={draft:'قيد الإعداد',submitted:'مقدّم للشركة',approved:'معتمد'};\nvar STATE_LABEL={draft:'قيد الإعداد',submitted:'مقدّم للشركة',approved:'معتمد',part:'مدفوع جزئياً',paid:'مدفوع'};\nvar DEDS=[['advance','استرداد دفعة مقدمة'],['retention','محتجز ضمان أعمال'],['tax','ضرائب مخصومة'],['penalties','غرامات وجزاءات'],['other','خصومات أخرى']];\nvar CUR=[['ج.م','جنيه مصري'],['ر.س','ريال سعودي'],['د.إ','درهم إماراتي'],['$','دولار']];\nvar LS='mustakhlasat-v1';\n\n/* ---------- state ---------- */\nvar S={companies:[],projects:[],invoices:[],settings:{currency:'ج.م'},sel:{c:null,p:null},q:'',filter:'all',\n  mode:'loading',loaded:{companies:false,projects:false,invoices:false,settings:false},stale:false,confirmEx:false};\nvar db=null, dl=null, sheet=null;\n\n/* ---------- helpers ---------- */\nfunction $(s){return document.querySelector(s)}\nfunction esc(s){return String(s==null?'':s).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]})}\nfunction num(v){\n  var s=String(v==null?'':v).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[٫]/g,'.').replace(/[٬,\\s]/g,'');\n  var n=parseFloat(s);return isFinite(n)?n:0;\n}\nfunction fmt(n){return (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2})}\nfunction fdate(iso){if(!iso)return '—';var p=String(iso).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso}\nfunction today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}\nfunction uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}\nfunction C(id){return S.companies.find(function(x){return x.id===id})}\nfunction P(id){return S.projects.find(function(x){return x.id===id})}\nfunction sum(a){return a.reduce(function(x,y){return x+y},0)}\nvar toastT;\nfunction toast(msg){var t=$('#toast');t.innerHTML='<span>'+esc(msg)+'<\/span>';clearTimeout(toastT);toastT=setTimeout(function(){t.innerHTML=''},3200)}\n\nfunction calc(i){\n  var w=num(i.workValue),vat=w*num(i.vatPct)/100,d=i.deductions||{};\n  var ded=sum(DEDS.map(function(k){return num(d[k[0]])}));\n  var net=w+vat-ded,paid=sum((i.payments||[]).map(function(p){return num(p.amount)}));\n  return {w:w,vat:vat,ded:ded,net:net,paid:paid,rem:net-paid};\n}\nfunction state(c,i){\n  if(c.net>0&&c.paid>=c.net-0.005)return 'paid';\n  if(c.paid>0)return 'part';\n  return i.stage||'draft';\n}\nfunction nextNumber(pid){\n  var m=0;S.invoices.forEach(function(i){if(i.projectId===pid&&i.kind!=='advance'){var n=parseInt(String(i.number).replace(/\\D/g,''),10);if(n>m)m=n}});\n  return String(m+1);\n}\n\n/* ---------- storage (cloud db, or this browser as fallback) ---------- */\nfunction lsSave(){try{localStorage.setItem(LS,JSON.stringify({companies:S.companies,projects:S.projects,invoices:S.invoices,settings:S.settings}))}catch(e){}}\nfunction lsLoad(){try{var o=JSON.parse(localStorage.getItem(LS)||'null');if(o){S.companies=o.companies||[];S.projects=o.projects||[];S.invoices=o.invoices||[];S.settings=o.settings||S.settings}}catch(e){}}\nfunction clean(o){return JSON.parse(JSON.stringify(o))}\nasync function put(col,id,data){\n  data=clean(data);\n  if(S.mode==='db'){await db.collection(col).doc(id).set(data);return}\n  var o=Object.assign({id:id},data),arr=S[col],k=arr.findIndex(function(x){return x.id===id});\n  if(k>=0)arr[k]=o;else arr.push(o);\n  lsSave();render();\n}\nasync function drop(col,id){\n  if(S.mode==='db'){await db.collection(col).doc(id).delete();return}\n  S[col]=S[col].filter(function(x){return x.id!==id});lsSave();render();\n}\nasync function setCurrency(v){\n  S.settings.currency=v;\n  try{\n    if(S.mode==='db')await db.collection('settings').doc('main').set({currency:v});else lsSave();\n  }catch(e){toast('تعذر حفظ العملة')}\n  render();\n}\nfunction fail(e){toast('تعذر الحفظ. تأكد من أن لديك صلاحية التعديل.');if(window.console)console.error(e)}\n\n/* ---------- rendering ---------- */\nfunction scoped(){\n  var l=S.invoices;\n  if(S.sel.p)l=l.filter(function(i){return i.projectId===S.sel.p});\n  else if(S.sel.c)l=l.filter(function(i){return i.companyId===S.sel.c});\n  return l;\n}\nfunction shown(){\n  var q=S.q.trim().toLowerCase();\n  var rows=scoped().map(function(i){return {i:i,c:calc(i)}});\n  if(S.filter==='due')rows=rows.filter(function(r){return r.c.rem>0.005
