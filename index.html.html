true;render();\n    },onErr);\n  }\n  try{var dd=use?await use('downloads'):null;if(dd){dl=dd;render()}}catch(e){}\n})();\n})();\n<\/script>\n<\/body><\/html>\n","accounting":"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>برنامج حسابات المقاولين<\/title>\n<style>\n:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2733;--mute:#6b7785;--line:#e1e6ec;--pri:#1f5fa8;--pri2:#174a85;--red:#c0392b;--green:#1e8449;--amber:#b9770e}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Segoe UI\",Tahoma,Arial,sans-serif;font-size:15px}\nheader{background:var(--pri);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}\nheader h1{margin:0;font-size:19px}\nnav{display:flex;gap:6px;flex-wrap:wrap}\nnav button{background:rgba(255,255,255,.12);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}\nnav button.active,nav button:hover{background:#fff;color:var(--pri)}\nmain{max-width:1200px;margin:18px auto;padding:0 14px}\n.page{display:none}.page.active{display:block}\n.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}\n.card h2{margin:0 0 12px;font-size:17px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}\n.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}\n.stat small{color:var(--mute)}.stat b{display:block;font-size:22px;margin-top:4px}\nlabel{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}\ninput,select,textarea{width:100%;padding:9px 10px;border:1px solid #cbd3dc;border-radius:8px;font:inherit;background:#fff;color:var(--ink)}\ninput:focus,select:focus,textarea:focus{outline:2px solid #9cc2ee;border-color:var(--pri)}\n.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:end}\n.full{grid-column:1/-1}\n.btn{background:var(--pri);color:#fff;border:0;padding:9px 18px;border-radius:8px;cursor:pointer;font:inherit}\n.btn:hover{background:var(--pri2)}\n.btn.sec{background:#e8edf3;color:var(--ink)}.btn.sec:hover{background:#d8e0ea}\n.btn.red{background:var(--red)}\n.btn.sm{padding:4px 10px;font-size:13px}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth{background:#eef2f6;text-align:right;padding:8px;border:1px solid var(--line);white-space:nowrap}\ntd{padding:7px 8px;border:1px solid var(--line);vertical-align:top}\ntr:nth-child(even) td{background:#fafbfc}\ntd.n,th.n{text-align:left;direction:ltr;white-space:nowrap}\ntfoot td{background:#eef2f6!important;font-weight:700}\n.deb{color:var(--red)}.cre{color:var(--green)}\n.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#eef2f6}\n.seg{display:flex;gap:8px}\n.seg label{flex:1;margin:0;border:1px solid #cbd3dc;border-radius:8px;padding:9px;text-align:center;cursor:pointer;color:var(--ink);font-size:15px}\n.seg input{display:none}\n.seg input:checked+span{font-weight:700}\n.seg label:has(input:checked).d{background:#fdecea;border-color:var(--red);color:var(--red)}\n.seg label:has(input:checked).c{background:#e8f6ee;border-color:var(--green);color:var(--green)}\n.scroll{overflow-x:auto}\ndialog{border:0;border-radius:12px;padding:18px;width:min(440px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.3)}\ndialog::backdrop{background:rgba(0,0,0,.4)}\n#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2733;color:#fff;padding:10px 20px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:99}\n#toast.show{opacity:1}\n.hint{color:var(--mute);font-size:13px}\n.empty{text-align:center;color:var(--mute);padding:20px}\n.rep-head{text-align:center;margin-bottom:12px}\n.rep-head h3{margin:0;font-size:20px}\n.rep-head p{margin:4px 0;color:var(--mute)}\n#appLogo{height:34px;max-width:90px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;vertical-align:middle;margin-left:10px}\n.org-head{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--pri);padding-bottom:10px;margin-bottom:12px}\n.org-head img{max-height:90px;max-width:160px;object-fit:contain}\n.org-info{flex:1;text-align:center}\n.org-info h3{margin:0 0 4px;font-size:22px;color:var(--pri)}\n.org-info p{margin:2px 0;color:var(--mute);font-size:13px}\n.org-foot{border-top:3px solid var(--pri);margin-top:24px;padding-top:8px;text-align:center;color:var(--mute);font-size:12px;background:#fff}\n.org-foot p{margin:2px 0}\n@media print{\n header,nav,.noprint,#toast{display:none!important}\n body{background:#fff;font-size:12px}\n .page{display:none!important}\n #page-reports{display:block!important}\n .card{border:0;padding:0}\n main{margin:0;max-width:none;padding:0}\n #reportOut{padding-bottom:80px!important}\n .org-foot{position:fixed;bottom:0;left:0;right:0;margin:0}\n .org-head,.org-foot{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n tr:nth-child(even) td{background:#fff}\n}\n.rep-banner{margin-bottom:10px}.rep-banner img{display:block;width:100%;height:auto}\n@media print{.rep-banner{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n<\/style>\n<\/head>\n<body>\n<header class=\"noprint\">\n  <h1><img id=\"appLogo\" alt=\"\" style=\"display:none\"><span id=\"appTitle\">برنامج حسابات المقاولين<\/span><\/h1>\n  <nav id=\"nav\">\n    <button data-p=\"dash\">الرئيسية<\/button>\n    <button data-p=\"entry\">قيد جديد<\/button>\n    <button data-p=\"ledger\">سجل القيود<\/button>\n    <button data-p=\"contractors\">المقاولين<\/button>\n    <button data-p=\"projects\">المشاريع<\/button>\n    <button data-p=\"reports\">التقارير والطباعة<\/button>\n    <button data-p=\"settings\">الإعدادات<\/button>\n  <\/nav>\n<\/header>\n<main>\n\n<!-- الرئيسية -->\n<section class=\"page\" id=\"page-dash\">\n  <div class=\"grid\" style=\"margin-bottom:16px\">\n    <div class=\"stat\"><small>إجمالي المدين<\/small><b class=\"deb\" id=\"sDeb\">0<\/b><\/div>\n    <div class=\"stat\"><small>إجمالي الدائن<\/small><b class=\"cre\" id=\"sCre\">0<\/b><\/div>\n    <div class=\"stat\"><small>الرصيد (مدين − دائن)<\/small><b id=\"sBal\">0<\/b><\/div>\n    <div class=\"stat\"><small>مقاولين / مشاريع / قيود<\/small><b id=\"sCnt\">0<\/b><\/div>\n  <\/div>\n  <div class=\"card\"><h2>أرصدة المقاولين<\/h2><div class=\"scroll\" id=\"dashC\"><\/div><\/div>\n  <div class=\"card\"><h2>أرصدة المشاريع<\/h2><div class=\"scroll\" id=\"dashP\"><\/div><\/div>\n<\/section>\n\n<!-- قيد جديد -->\n<section class=\"page\" id=\"page-entry\">\n  <div class=\"card\">\n    <h2 id=\"entryTitle\">قيد جديد<\/h2>\n    <form id=\"entryForm\" class=\"form\">\n      <div><label>التاريخ<\/label><input type=\"date\" id=\"eDate\" required><\/div>\n      <div>\n        <label>المقاول<\/label>\n        <div class=\"row\" style=\"flex-wrap:nowrap\"><select id=\"eCon\" required><\/select><button type=\"button\" class=\"btn sec sm\" onclick=\"quickAdd('con')\">+<\/button><\/div>\n      <\/div>\n      <div>\n        <label>المشروع<\/label>\n        <div class=\"row\" style=\"flex-wrap:nowrap\"><select id=\"ePro\" required><\/select><button type=\"button\" class=\"btn sec sm\" onclick=\"quickAdd('pro')\">+<\/button><\/div>\n      <\/div>\n      <div class=\"full\">\n        <label>نوع القيد<\/label>\n        <div class=\"seg\">\n          <label class=\"d\"><input type=\"radio\" name=\"eType\" value=\"D\" checked><span>مدين (عليه)<\/span><\/label>\n          <label class=\"c\"><input type=\"radio\" name=\"eType\" value=\"C\"><span>دائن (له)<\/span><\/label>\n        <\/div>\n      <\/div>\n      <div><label>تصنيف المبلغ<\/label><select id=\"eCat\"><\/select><\/div>\n      <div><label>المبلغ<\/label><input type=\"number\" id=\"eAmt\" step=\"0.01\" min=\"0.01\" required><\/div>\n      <div><label>رقم الفاتورة (اختياري)<\/label><input id=\"eInv\"><\/div>\n      <div class=\"full\"><label>البيان / ملاحظات<\/label><input id=\"eDesc\"><\/div>\n      <div class=\"full row\">\n        <button class=\"btn\" type=\"submit\">حفظ القيد<\/button>\n        <button class=\"btn sec\" type=\"button\" onclick=\"resetEntry()\">قيد جديد / إلغاء التعديل<\/button>\n      <\/div>\n    <\/form>\n    <p class=\"hint\">مدين = مبالغ خرجت للمقاول (عهدة، دفعات، مصاريف عليه). دائن = مستحقات له (فواتير أعماله، مستخلصات). الرصيد = المدين − الدائن.<\/p>\n  <\/div>\n<\/section>\n\n<!-- سجل القيود -->\n<section class=\"page\" id=\"page-ledger\">\n  <div class=\"card\">\n    <h2>سجل القيود<\/h2>\n    <div class=\"row noprint\" style=\"margin-bottom:10px\">\n      <input id=\"lSearch\" placeholder=\"بحث...\" style=\"max-width:220px\">\n      <select id=\"lCon\" style=\"max-width:200px\"><\/select>\n      <select id=\"lPro\" style=\"max-width:200px\"><\/select>\n    <\/div>\n    <div class=\"scroll\" id=\"ledgerOut\"><\/div>\n  <\/div>\n<\/section>\n\n<!-- المقاولين -->\n<section class=\"page\" id=\"page-contractors\">\n  <div class=\"card\">\n    <h2 id=\"conTitle\">إضافة مقاول<\/h2>\n    <form id=\"conForm\" class=\"form\">\n      <div><label>اسم المقاول<\/label><input id=\"cName\" required><\/div>\n      <div><label>الجوال<\/label><input id=\"cPhone\"><\/div>\n      <div><label>التخصص<\/label><input id=\"cSpec\" placeholder=\"سباكة، كهرباء، بناء...\"><\/div>\n      <div><label>ملاحظات<\/label><input id=\"cNote\"><\/div>\n      <div class=\"row\"><button class=\"btn\" type=\"submit\">حفظ<\/button><button type=\"button\" class=\"btn sec\" onclick=\"resetCon()\">جديد<\/button><\/div>\n    <\/form>\n  <\/div>\n  <div class=\"card\"><div class=\"scroll\" id=\"conOut\"><\/div><\/div>\n<\/section>\n\n<!-- المشاريع -->\n<section class=\"page\" id=\"page-projects\">\n  <div class=\"card\">\n    <h2 id=\"proTitle\">إضافة مشروع<\/h2>\n    <form id=\"proForm\" class=\"form\">\n      <div><label>اسم المشروع<\/label><input id=\"pName\" required><\/div>\n      <div><label>المالك / العميل<\/label><input id=\"pClient\"><\/div>\n      <div><label>الموقع<\/label><input id=\"pLoc\"><\/div>\n      <div><label>المقاول المسلَّم له<\/label><select id=\"pCon\"><\/select><\/div>\n      <div><label>قيمة المشروع / التعاقد<\/label><input type=\"number\" step=\"0.01\" min=\"0\" id=\"pVal\"><\/div>\n      <div><label>الحالة<\/label><select id=\"pStat\"><option>جاري<\/option><option>منتهي<\/option><option>متوقف<\/option><\/select><\/div>\n      <div class=\"full\"><label>ملاحظات<\/label><input id=\"pNote\"><\/div>\n      <div class=\"row\"><button class=\"btn\" type=\"submit\">حفظ<\/button><button type=\"button\" class=\"btn sec\" onclick=\"resetPro()\">جديد<\/button><\/div>\n    <\/form>\n  <\/div>\n  <div class=\"card\"><div class=\"scroll\" id=\"proOut\"><\/div><\/div>\n<\/section>\n\n<!-- التقارير -->\n<section class=\"page\" id=\"page-reports\">\n  <div class=\"card noprint\">\n    <h2>كشف حساب / تقرير<\/h2>\n    <div class=\"form\">\n      <div><label>المقاول<\/label><select id=\"rCon\"><\/select><\/div>\n      <div><label>المشروع<\/label><select id=\"rPro\"><\/select><\/div>\n      <div><label>نوع القيد<\/label><select id=\"rType\"><option value=\"\">الكل (مدين ودائن)<\/option><option value=\"D\">مدين فقط<\/option><option value=\"C\">دائن فقط<\/option><\/select><\/div>\n      <div><label>التصنيف<\/label><select id=\"rCat\"><\/select><\/div>\n      <div><label>من تاريخ<\/label><input type=\"date\" id=\"rFrom\"><\/div>\n      <div><label>إلى تاريخ<\/label><input type=\"date\" id=\"rTo\"><\/div>\n      <div class=\"row\">\n        <button class=\"btn\" onclick=\"runReport()\">عرض التقرير<\/button>\n        <button class=\"btn sec\" onclick=\"window.print()\">طباعة<\/button>\n        <button class=\"btn sec\" onclick=\"exportCSV()\">Excel/CSV<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"card\" id=\"reportOut\"><div class=\"empty\">اختر الفلاتر ثم اضغط «عرض التقرير»<\/div><\/div>\n<\/section>\n\n<!-- الإعدادات -->\n<section class=\"page\" id=\"page-settings\">\n  <div class=\"card\">\n    <h2>بيانات المؤسسة (تظهر أعلى وأسفل التقارير المطبوعة)<\/h2>\n    <div class=\"form\">\n      <div><label>اسم المؤسسة<\/label><input id=\"sCompany\"><\/div>\n      <div><label>النشاط / الوصف<\/label><input id=\"sActivity\" placeholder=\"مقاولات عامة وتشطيبات...\"><\/div>\n      <div><label>العنوان<\/label><input id=\"sAddr\"><\/div>\n      <div><label>الهاتف<\/label><input id=\"sTel\"><\/div>\n      <div><label>البريد الإلكتروني<\/label><input id=\"sMail\"><\/div>\n      <div><label>السجل التجاري / الرقم الضريبي<\/label><input id=\"sReg\"><\/div>\n      <div><label>العملة<\/label><input id=\"sCur\"><\/div>\n      <div class=\"full\"><label>نص أسفل التقرير (اختياري)<\/label><input id=\"sFoot\" placeholder=\"شكراً لتعاملكم معنا\"><\/div>\n      <div class=\"full\">\n        <label>اللوجو<\/label>\n        <div class=\"row\">\n          <img id=\"sLogoPrev\" alt=\"\" style=\"display:none;max-height:80px;max-width:200px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff\">\n          <label class=\"btn sec\" style=\"margin:0;cursor:pointer;color:var(--ink)\">اختيار صورة<input type=\"file\" id=\"sLogoFile\" accept=\"image/*\" style=\"display:none\"><\/label>\n          <button type=\"button\" class=\"btn sec\" onclick=\"removeLogo()\">إزالة اللوجو<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"full row\"><button class=\"btn\" onclick=\"saveSettings()\">حفظ الإعدادات<\/button><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"card\">\n    <h2>النسخ الاحتياطي<\/h2>\n    <p class=\"hint\">البيانات محفوظة على هذا الجهاز داخل المتصفح. خذ «نسخة احتياطية شاملة» من الصفحة الرئيسية بشكل دوري.<\/p>\n    <div class=\"row\">\n      <button class=\"btn\" onclick=\"backup()\">تنزيل نسخة احتياطية<\/button>\n      <label class=\"btn sec\" style=\"margin:0;cursor:pointer\">استيراد نسخة<input type=\"file\" id=\"impFile\" accept=\".json\" style=\"display:none\"><\/label>\n      <button class=\"btn red\" onclick=\"wipe()\">مسح كل البيانات<\/button>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n\n<dialog id=\"dlg\"><form method=\"dialog\" id=\"dlgForm\" style=\"margin:0\"><\/form><\/dialog>\n<div id=\"toast\"><\/div>\n\n<script>\nconst KEY='contracting_acc_v1';\nconst CATS=['عهدة','مصاريف','دفعة','فاتورة','خصم / جزاء','تسوية','أخرى'];\nconst $=id=>document.getElementById(id);\nlet db=load();\nlet editEntry=null,editCon=null,editPro=null,lastRows=[];\n\nfunction load(){\n  let d=null;\n  try{const r=localStorage.getItem(KEY);if(r)d=JSON.parse(r)}catch(e){}\n  d=d||{};\n  d.settings=Object.assign({company:'مؤسسة المقاولات',currency:'ريال',activity:'',addr:'',tel:'',mail:'',reg:'',foot:'',logo:''},d.settings||{});\n  d.contractors=d.contractors||[];d.projects=d.projects||[];d.entries=d.entries||[];\n  return d;\n}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('تعذر الحفظ في المتصفح — نزّل نسخة احتياطية')}}\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst fmt=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};\nconst conName=id=>(db.contractors.find(c=>c.id===id)||{}).name||'—';\nconst proName=id=>(db.projects.find(p=>p.id===id)||{}).name||'—';\nfunction toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}\nfunction balHTML(b){\n  if(Math.abs(b)<0.005)return '<span>0.00<\/span>';\n  return b>0?`<span class=\"deb\">${fmt(b)} مدين<\/span>`:`<span class=\"cre\">${fmt(-b)} دائن<\/span>`;\n}\nfunction sums(list){let d=0,c=0;list.forEach(e=>{e.type==='D'?d+=e.amount:c+=e.amount});return{d,c,b:d-c}}\n\n/* ---------- التنقل ---------- */\nfunction show(p){\n  // الخروج من صفحة وهي في وضع التعديل يلغي التعديل، حتى لا يكتب القيد/المقاول/المشروع الجديد فوق القديم\n  if(editEntry&&p!=='entry')resetEntry();\n  if(editCon&&p!=='contractors')resetCon();\n  if(editPro&&p!=='projects')resetPro();\n  document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+p));\n  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));\n  if(p==='dash')renderDash();\n  if(p==='entry')fillEntrySelects();\n  if(p==='ledger')renderLedger();\n  if(p==='contractors')renderCon();\n  if(p==='projects'){fillProCon();renderPro()}\n  if(p==='reports')fillReportSelects();\n  if(p==='settings')fillSettings();\n  window.scrollTo(0,0);\n}\n$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.p)});\n\n/* ---------- الرئيسية ---------- */\nfunction renderDash(){\n  const s=sums(db.entries);\n  $('sDeb').textContent=fmt(s.d);$('sCre').textContent=fmt(s.c);\n  $('sBal').innerHTML=balHTML(s.b);\n  $('sCnt').textContent=`${db.contractors.length} / ${db.projects.length} / ${db.entries.length}`;\n  $('dashC').innerHTML=balTable(db.contractors,'conId','con');\n  $('dashP').innerHTML=balTable(db.projects,'proId','pro');\n}\nfunction balTable(list,key,kind){\n  if(!list.length)return '<div class=\"empty\">لا توجد بيانات بعد<\/div>';\n  let h='<table><thead><tr><th>الاسم<\/th><th class=\"n\">مدين<\/th><th class=\"n\">دائن<\/th><th class=\"n\">الرصيد<\/th><th class=\"noprint\"><\/th><\/tr><\/thead><tbody>';\n  list.forEach(x=>{\n    const s=sums(db.entries.filter(e=>e[key]===x.id));\n    h+=`<tr><td>${esc(x.name)}<\/td><td class=\"n deb\">${fmt(s.d)}<\/td><td class=\"n cre\">${fmt(s.c)}<\/td><td class=\"n\">${balHTML(s.b)}<\/td><td class=\"noprint\"><button class=\"btn sm sec\" onclick=\"statement('${kind}','${x.id}')\">كشف حساب<\/button><\/td><\/tr>`;\n  });\n  return h+'<\/tbody><\/table>';\n}\nfunction statement(kind,id){\n  show('reports');\n  $('rCon').value=kind==='con'?id:'';\n  $('rPro').value=kind==='pro'?id:'';\n  $('rType').value='';$('rCat').value='';$('rFrom').value='';$('rTo').value='';\n  runReport();\n}\n\n/* ---------- القيود ---------- */\nfunction opt(list,ph,sel){\n  return (ph!==null?`<option value=\"\">${ph}<\/option>`:'')+list.map(x=>`<option value=\"${x.id}\"${x.id===sel?' selected':''}>${esc(x.name)}<\/option>`).join('');\n}\nfunction fillEntrySelects(keepCon,keepPro){\n  const con=keepCon!==undefined?keepCon:$('eCon').value;\n  const pro=keepPro!==undefined?keepPro:$('ePro').value;\n  $('eCon').innerHTML=opt(db.contractors,'— اختر المقاول —',con);\n  fillEntryProjects(pro);\n  $('eCat').innerHTML=CATS.map(c=>`<option>${c}<\/option>`).join('');\n  if(!$('eDate').value)$('eDate').value=today();\n}\nfunction fillEntryProjects(sel){\n  const c=$('eCon').value;\n  const mine=db.projects.filter(p=>c&&p.contractorId===c);\n  const others=db.projects.filter(p=>!(c&&p.contractorId===c));\n  let h='<option value=\"\">— اختر المشروع —<\/option>';\n  if(mine.length)h+=`<optgroup label=\"مشاريع هذا المقاول\">${opt(mine,null,sel)}<\/optgroup>`;\n  if(others.length)h+=`<optgroup label=\"${mine.length?'مشاريع أخرى':'كل المشاريع'}\">${opt(others,null,sel)}<\/optgroup>`;\n  $('ePro').innerHTML=h;\n  if(sel)$('ePro').value=sel;\n}\n$('eCon').addEventListener('change',()=>{\n  const c=$('eCon').value;const mine=db.projects.filter(p=>p.contractorId===c);\n  fillEntryProjects(mine.length===1?mine[0].id:'');\n});\n$('entryForm').addEventListener('submit',ev=>{\n  ev.preventDefault();\n  const amt=parseFloat($('eAmt').value);\n  if(!(amt>0))return toast('أدخل مبلغ صحيح');\n  if(!$('eCon').value||!$('ePro').value)return toast('اختر المقاول والمشروع');\n  const o={date:$('eDate').value,conId:$('eCon').value,proId:$('ePro').value,\n    type:document.querySelector('input[name=eType]:checked').value,cat:$('eCat').value,\n    amount:Math.round(amt*100)/100,inv:$('eInv').value.trim(),desc:$('eDesc').value.trim()};\n  if(editEntry){Object.assign(db.entries.find(e=>e.id===editEntry),o);toast('تم تعديل القيد')}\n  else{o.id=uid();o.ts=Date.now();db.entries.push(o);toast('تم حفظ القيد')}\n  save();\n  const keepC=o.conId,keepP=o.proId;\n  resetEntry(keepC,keepP);\n});\nfunction resetEntry(c,p){\n  editEntry=null;$('entryTitle').textContent='قيد جديد';\n  $('eAmt').value='';$('eInv').value='';$('eDesc').value='';\n  document.querySelector('input[name=eType][value=D]').checked=true;\n  fillEntrySelects(c||'',p||'');\n  $('eDate').value=$('eDate').value||today();\n}\nfunction editEntryRow(id){\n  const e=db.entries.find(x=>x.id===id);if(!e)return;\n  show('entry');editEntry=id;$('entryTitle').textContent='تعديل قيد';\n  fillEntrySelects(e.conId,e.proId);\n  $('eDate').value=e.date;$('eCat').value=e.cat;$('eAmt').value=e.amount;\n  $('eInv').value=e.inv||'';$('eDesc').value=e.desc||'';\n  document.querySelector(`input[name=eType][value=${e.type}]`).checked=true;\n}\nfunction delEntry(id){\n  if(!confirm('حذف هذا القيد نهائياً؟'))return;\n  db.entries=db.entries.filter(e=>e.id!==id);save();renderLedger();toast('تم الحذف');\n}\nfunction renderLedger(){\n  const c=$('lCon').value,p=$('lPro').value;\n  $('lCon').innerHTML=opt(db.contractors,'كل المقاولين',c);$('lPro').innerHTML=opt(db.projects,'كل المشاريع',p);\n  const q=$('lSearch').value.trim();\n  let list=db.entries.filter(e=>(!c||e.conId===c)&&(!p||e.proId===p));\n  if(q)list=list.filter(e=>[conName(e.conId),proName(e.proId),e.desc,e.inv,e.cat,e.amount].join(' ').includes(q));\n  list.sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);\n  if(!list.length){$('ledgerOut').innerHTML='<div class=\"empty\">لا توجد قيود<\/div>';return}\n  let h='<table><thead><tr><th>التاريخ<\/th><th>المقاول<\/th><th>المشروع<\/th><th>التصنيف<\/th><th>فاتورة<\/th><th>البيان<\/th><th class=\"n\">مدين<\/th><th class=\"n\">دائن<\/th><th><\/th><\/tr><\/thead><tbody>';\n  list.forEach(e=>{\n    h+=`<tr><td>${e.date}<\/td><td>${esc(conName(e.conId))}<\/td><td>${esc(proName(e.proId))}<\/td><td><span class=\"tag\">${esc(e.cat)}<\/span><\/td><td>${esc(e.inv)}<\/td><td>${esc(e.desc)}<\/td>\n    <td class=\"n deb\">${e.type==='D'?fmt(e.amount):''}<\/td><td class=\"n cre\">${e.type==='C'?fmt(e.amount):''}<\/td>\n    <td class=\"row\" style=\"flex-wrap:nowrap\"><button class=\"btn sm sec\" onclick=\"editEntryRow('${e.id}')\">تعديل<\/button><button class=\"btn sm red\" onclick=\"delEntry('${e.id}')\">حذف<\/button><\/td><\/tr>`;\n  });\n  const s=sums(list);\n  h+=`<\/tbody><tfoot><tr><td colspan=\"6\">الإجمالي (${list.length} قيد)<\/td><td class=\"n deb\">${fmt(s.d)}<\/td><td class=\"n cre\">${fmt(s.c)}<\/td><td><\/td><\/tr><\/tfoot><\/table>`;\n  $('ledgerOut').innerHTML=h;\n}\n['lSearch','lCon','lPro'].forEach(i=>$(i).addEventListener('input',renderLedger));\n\n/* ---------- المقاولين ---------- */\n$('conForm').addEventListener('submit',ev=>{\n  ev.preventDefault();\n  const o={name:$('cName').value.trim(),phone:$('cPhone').value.trim(),spec:$('cSpec').value.trim(),note:$('cNote').value.trim()};\n  if(!o.name)return;\n  if(editCon)Object.assign(db.contractors.find(c=>c.id===editCon),o);\n  else db.contractors.push(Object.assign({id:uid()},o));\n  save();toast('تم الحفظ');resetCon();renderCon();\n});\nfunction resetCon(){editCon=null;$('conTitle').textContent='إضافة مقاول';$('conForm').reset()}\nfunction editConRow(id){\n  const c=db.contractors.find(x=>x.id===id);editCon=id;$('conTitle').textContent='تعديل مقاول';\n  $('cName').value=c.name;$('cPhone').value=c.phone||'';$('cSpec').value=c.spec||'';$('cNote').value=c.note||'';\n  window.scrollTo(0,0);\n}\nfunction delCon(id){\n  if(db.entries.some(e=>e.conId===id))return alert('لا يمكن حذف مقاول عليه قيود. احذف قيوده أولاً.');\n  if(!confirm('حذف المقاول؟'))return;\n  db.contractors=db.contractors.filter(c=>c.id!==id);\n  db.projects.forEach(p=>{if(p.contractorId===id)p.contractorId=''});\n  save();renderCon();\n}\nfunction renderCon(){\n  if(!db.contractors.length){$('conOut').innerHTML='<div class=\"empty\">لم تُضف مقاولين بعد<\/div>';return}\n  let h='<table><thead><tr><th>الاسم<\/th><th>الجوال<\/th><th>التخصص<\/th><th>المشاريع<\/th><th class=\"n\">مدين<\/th><th class=\"n\">دائن<\/th><th class=\"n\">الرصيد<\/th><th><\/th><\/tr><\/thead><tbody>';\n  db.contractors.forEach(c=>{\n    const s=sums(db.entries.filter(e=>e.conId===c.id));\n    const np=new Set(db.entries.filter(e=>e.conId===c.id).map(e=>e.proId).concat(db.projects.filter(p=>p.contractorId===c.id).map(p=>p.id))).size;\n    h+=`<tr><td>${esc(c.name)}<\/td><td>${esc(c.phone)}<\/td><td>${esc(c.spec)}<\/td><td>${np}<\/td><td class=\"n deb\">${fmt(s.d)}<\/td><td class=\"n cre\">${fmt(s.c)}<\/td><td class=\"n\">${balHTML(s.b)}<\/td>\n    <td class=\"row\" style=\"flex-wrap:nowrap\"><button class=\"btn sm\" onclick=\"statement('con','${c.id}')\">كشف<\/button><button class=\"btn sm sec\" onclick=\"editConRow('${c.id}')\">تعديل<\/button><button class=\"btn sm red\" onclick=\"delCon('${c.id}')\">حذف<\/button><\/td><\/tr>`;\n  });\n  $('conOut').innerHTML=h+'<\/tbody><\/table>';\n}\n\n/* ---------- المشاريع ---------- */\nfunction fillProCon(){const v=$('pCon').value;$('pCon').innerHTML=opt(db.contractors,'— بدون —',v)}\n$('proForm').addEventListener('submit',ev=>{\n  ev.preventDefault();\n  const o={name:$('pName').value.trim(),client:$('pClient').value.trim(),loc:$('pLoc').value.trim(),contractorId:$('pCon').value,\n    value:parseFloat($('pVal').value)||0,status:$('pStat').value,note:$('pNote').value.trim()};\n  if(!o.name)return;\n  if(editPro)Object.assign(db.projects.find(p=>p.id===editPro),o);\n  else db.projects.push(Object.assign({id:uid()},o));\n  save();toast('تم الحفظ');resetPro();renderPro();\n});\nfunction resetPro(){editPro=null;$('proTitle').textContent='إضافة مشروع';$('proForm').reset();fillProCon()}\nfunction editProRow(id){\n  const p=db.projects.find(x=>x.id===id);editPro=id;$('proTitle').textContent='تعديل مشروع';fillProCon();\n  $('pName').value=p.name;$('pClient').value=p.client||'';$('pLoc').value=p.loc||'';$('pCon').value=p.contractorId||'';\n  $('pVal').value=p.value||'';$('pStat').value=p.status||'جاري';$('pNote').value=p.note||'';\n  window.scrollTo(0,0);\n}\nfunction delPro(id){\n  if(db.entries.some(e=>e.proId===id))return alert('لا يمكن حذف مشروع عليه قيود. احذف قيوده أولاً.');\n  if(!confirm('حذف المشروع؟'))return;\n  db.projects=db.projects.filter(p=>p.id!==id);save();renderPro();\n}\nfunction renderPro(){\n  if(!db.projects.length){$('proOut').innerHTML='<div class=\"empty\">لم تُضف مشاريع بعد<\/div>';return}\n  let h='<table><thead><tr><th>المشروع<\/th><th>العميل<\/th><th>المقاول<\/th><th>الحالة<\/th><th class=\"n\">قيمة التعاقد<\/th><th class=\"n\">مدين<\/th><th class=\"n\">دائن<\/th><th class=\"n\">الرصيد<\/th><th><\/th><\/tr><\/thead><tbody>';\n  db.projects.forEach(p=>{\n    const s=sums(db.entries.filter(e=>e.proId===p.id));\n    h+=`<tr><td>${esc(p.name)}<\/td><td>${esc(p.client)}<\/td><td>${p.contractorId?esc(conName(p.contractorId)):'—'}<\/td><td><span class=\"tag\">${esc(p.status)}<\/span><\/td><td class=\"n\">${p.value?fmt(p.value):''}<\/td><td class=\"n deb\">${fmt(s.d)}<\/td><td class=\"n cre\">${fmt(s.c)}<\/td><td class=\"n\">${balHTML(s.b)}<\/td>\n    <td class=\"row\" style=\"flex-wrap:nowrap\"><button class=\"btn sm\" onclick=\"statement('pro','${p.id}')\">كشف<\/button><button class=\"btn sm\" style=\"background:var(--green)\" onclick=\"settlePro('${p.id}')\">تسوية<\/button><button class=\"btn sm sec\" onclick=\"editProRow('${p.id}')\">تعديل<\/button><button class=\"btn sm red\" onclick=\"delPro('${p.id}')\">حذف<\/button><\/td><\/tr>`;\n  });\n  $('proOut').innerHTML=h+'<\/tbody><\/table>';\n}\n\n/* ---------- تسوية وإقفال حساب مشروع ---------- */\nfunction settlePro(id){\n  const p=db.projects.find(x=>x.id===id);if(!p)return;\n  const byCon={};\n  db.entries.filter(e=>e.proId===id).forEach(e=>{byCon[e.conId]=(byCon[e.conId]||0)+(e.type==='D'?e.amount:-e.amount)});\n  const items=Object.keys(byCon).map(c=>({c,b:Math.round(byCon[c]*100)/100})).filter(x=>Math.abs(x.b)>=0.01);\n  if(!items.length){\n    alert(db.entries.some(e=>e.proId===id)?'حساب هذا المشروع متسوّى بالفعل: المدين = الدائن.':'لا توجد قيود على هذا المشروع.');\n    return;\n  }\n  const f=$('dlgForm');\n  f.innerHTML=`<h2 style=\"margin-top:0\">تسوية وإقفال: ${esc(p.name)}<\/h2>\n  <p class=\"hint\">سيُضاف قيد «تسوية» لكل مقاول بمقدار الرصيد المتبقي في الجهة المقابلة، فيتساوى المدين مع الدائن ويصير الرصيد صفر:<\/p>\n  <table style=\"margin-bottom:12px\"><tbody>${items.map(x=>`<tr><td>${esc(conName(x.c))}<\/td><td class=\"n\">${fmt(Math.abs(x.b))}<\/td><td>${x.b>0?'قيد دائن (له)':'قيد مدين (عليه)'}<\/td><\/tr>`).join('')}<\/tbody><\/table>\n  <label>تاريخ التسوية<\/label><input type=\"date\" id=\"zDate\" value=\"${today()}\"><br><br>\n  <label style=\"display:flex;gap:8px;align-items:center;color:var(--ink)\"><input type=\"checkbox\" id=\"zDone\" checked style=\"width:auto\"> تحويل حالة المشروع إلى «منتهي»<\/label><br>\n  <div class=\"row\"><button class=\"btn\" value=\"ok\">تنفيذ التسوية<\/button><button class=\"btn sec\" value=\"cancel\" formnovalidate>إلغاء<\/button><\/div>`;\n  f.onsubmit=ev=>{\n    if(!ev.submitter||ev.submitter.value!=='ok')return;\n    const date=$('zDate').value||today();\n    items.forEach((x,i)=>{\n      db.entries.push({id:uid(),ts:Date.now()+i,date,conId:x.c,proId:id,type:x.b>0?'C':'D',cat:'تسوية',\n        amount:Math.abs(x.b),inv:'',desc:'تسوية وإقفال حساب مشروع '+p.name});\n    });\n    if($('zDone').checked)p.status='منتهي';\n    save();renderPro();toast('تمت التسوية — المدين = الدائن');\n  };\n  $('dlg').showModal();\n}\n\n/* ---------- إضافة سريعة (نافذة) ---------- */\nfunction quickAdd(kind){\n  const f=$('dlgForm');\n  if(kind==='con'){\n    f.innerHTML=`<h2 style=\"margin-top:0\">مقاول جديد<\/h2><label>الاسم<\/label><input id=\"qName\" required><br><br><label>الجوال<\/label><input id=\"qPhone\"><br><br>\n    <div class=\"row\"><button class=\"btn\" value=\"ok\">حفظ<\/button><button class=\"btn sec\" value=\"cancel\" formnovalidate>إلغاء<\/button><\/div>`;\n  }else{\n    f.innerHTML=`<h2 style=\"margin-top:0\">مشروع جديد<\/h2><label>اسم المشروع<\/label><input id=\"qName\" required><br><br>\n    <label>المقاول<\/label><select id=\"qCon\">${opt(db.contractors,'— بدون —',$('eCon').value)}<\/select><br><br><label>قيمة التعاقد<\/label><input id=\"qVal\" type=\"number\" step=\"0.01\" min=\"0\"><br><br>\n    <div class=\"row\"><button class=\"btn\" value=\"ok\">حفظ<\/button><button class=\"btn sec\" value=\"cancel\" formnovalidate>إلغاء<\/button><\/div>`;\n  }\n  f.onsubmit=ev=>{\n    const v=ev.submitter&&ev.submitter.value;\n    if(v!=='ok')return;\n    const name=$('qName').value.trim();if(!name)return;\n    if(kind==='con'){\n      const o={id:uid(),name,phone:$('qPhone').value.trim(),spec:'',note:''};\n      db.contractors.push(o);save();fillEntrySelects(o.id,'');\n    }else{\n      const o={id:uid(),name,client:'',loc:'',contractorId:$('qCon').value,value:parseFloat($('qVal').value)||0,status:'جاري',note:''};\n      db.projects.push(o);save();fillEntrySelects($('eCon').value,o.id);\n    }\n    toast('تمت الإضافة');\n  };\n  $('dlg').showModal();\n  setTimeout(()=>$('qName').focus(),50);\n}\n\n/* ---------- التقارير ---------- */\nfunction fillReportSelects(){\n  const c=$('rCon').value,p=$('rPro').value,k=$('rCat').value;\n  $('rCon').innerHTML=opt(db.contractors,'كل المقاولين',c);\n  $('rPro').innerHTML=opt(db.projects,'كل المشاريع',p);\n  $('rCat').innerHTML='<option value=\"\">كل التصنيفات<\/option>'+CATS.map(x=>`<option${x===k?' selected':''}>${x}<\/option>`).join('');\n}\nfunction runReport(){\n  const c=$('rCon').value,p=$('rPro').value,t=$('rType').value,k=$('rCat').value,f=$('rFrom').value,to=$('rTo').value;\n  let list=db.entries.filter(e=>(!c||e.conId===c)&&(!p||e.proId===p)&&(!t||e.type===t)&&(!k||e.cat===k)&&(!f||e.date>=f)&&(!to||e.date<=to));\n  list.sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);\n  lastRows=list;\n  const cur=db.settings.currency;\n  const filt=[];\n  filt.push('المقاول: '+(c?conName(c):'الكل'));\n  filt.push('المشروع: '+(p?proName(p):'الكل'));\n  if(t)filt.push('النوع: '+(t==='D'?'مدين':'دائن'));\n  if(k)filt.push('التصنيف: '+k);\n  if(f||to)filt.push(`الفترة: ${f||'...'} إلى ${to||'...'}`);\n  let h=orgHeader()+`<div class=\"rep-head\"><p><b style=\"font-size:18px\">كشف حساب<\/b><\/p><p>${esc(filt.join(' | '))}<\/p><p>تاريخ الطباعة: ${today()} — العملة: ${esc(cur)}<\/p><\/div>`;\n  if(!list.length){$('reportOut').innerHTML=h+'<div class=\"empty\">لا توجد قيود مطابقة<\/div>'+orgFooter();return}\n  let run=0;\n  h+='<div class=\"scroll\"><table><thead><tr><th>م<\/th><th>التاريخ<\/th><th>المقاول<\/th><th>المشروع<\/th><th>التصنيف<\/th><th>فاتورة<\/th><th>البيان<\/th><th class=\"n\">مدين<\/th><th class=\"n\">دائن<\/th><th class=\"n\">الرصيد<\/th><\/tr><\/thead><tbody>';\n  list.forEach((e,i)=>{\n    run+=e.type==='D'?e.amount:-e.amount;\n    h+=`<tr><td>${i+1}<\/td><td>${e.date}<\/td><td>${esc(conName(e.conId))}<\/td><td>${esc(proName(e.proId))}<\/td><td>${esc(e.cat)}<\/td><td>${esc(e.inv)}<\/td><td>${esc(e.desc)}<\/td>\n    <td class=\"n\">${e.type==='D'?fmt(e.amount):''}<\/td><td class=\"n\">${e.type==='C'?fmt(e.amount):''}<\/td><td class=\"n\">${balHTML(run)}<\/td><\/tr>`;\n  });\n  const s=sums(list);\n  h+=`<\/tbody><tfoot><tr><td colspan=\"7\">الإجمالي<\/td><td class=\"n\">${fmt(s.d)}<\/td><td class=\"n\">${fmt(s.c)}<\/td><td class=\"n\">${balHTML(s.b)}<\/td><\/tr><\/tfoot><\/table><\/div>`;\n  // ملخص حسب التصنيف\n  const by={};list.forEach(e=>{by[e.cat]=by[e.cat]||{d:0,c:0};e.type==='D'?by[e.cat].d+=e.amount:by[e.cat].c+=e.amount});\n  h+='<h4 style=\"margin:18px 0 8px\">ملخص حسب التصنيف<\/h4><table style=\"max-width:520px\"><thead><tr><th>التصنيف<\/th><th class=\"n\">مدين<\/th><th class=\"n\">دائن<\/th><\/tr><\/thead><tbody>';\n  Object.keys(by).forEach(k2=>{h+=`<tr><td>${esc(k2)}<\/td><td class=\"n\">${fmt(by[k2].d)}<\/td><td class=\"n\">${fmt(by[k2].c)}<\/td><\/tr>`});\n  h+='<\/tbody><\/table>';\n  h+=`<p style=\"margin-top:14px\"><b>الرصيد النهائي:<\/b> ${balHTML(s.b)}<\/p>`;\n  h+='<div style=\"display:flex;justify-content:space-between;margin-top:40px\"><span>توقيع المحاسب: ..............<\/span><span>توقيع المقاول: ..............<\/span><\/div>';\n  $('reportOut').innerHTML=h+orgFooter();\n}\nfunction exportCSV(){\n  if(!lastRows.length)return toast('اعرض التقرير أولاً');\n  const q=v=>'\"'+String(v==null?'':v).replace(/\"/g,'\"\"')+'\"';\n  let run=0;\n  const rows=[['التاريخ','المقاول','المشروع','التصنيف','رقم الفاتورة','البيان','مدين','دائن','الرصيد']];\n  lastRows.forEach(e=>{run+=e.type==='D'?e.amount:-e.amount;\n    rows.push([e.date,conName(e.conId),proName(e.proId),e.cat,e.inv,e.desc,e.type==='D'?e.amount:'',e.type==='C'?e.amount:'',run.toFixed(2)])});\n  dl('\\ufeff'+rows.map(r=>r.map(q).join(',')).join('\\r\\n'),'report-'+today()+'.csv','text/csv;charset=utf-8');\n}\n\n/* ---------- الإعدادات / نسخ احتياطي ---------- */\nfunction fillSettings(){\n  const s=db.settings;\n  $('sCompany').value=s.company;$('sActivity').value=s.activity;$('sAddr').value=s.addr;\n  $('sTel').value=s.tel;$('sMail').value=s.mail;$('sReg').value=s.reg;$('sCur').value=s.currency;$('sFoot').value=s.foot;\n  const p=$('sLogoPrev');if(s.logo){p.src=s.logo;p.style.display=''}else{p.removeAttribute('src');p.style.display='none'}\n}\nfunction saveSettings(){\n  const s=db.settings;\n  s.company=$('sCompany').value.trim()||'مؤسسة المقاولات';\n  s.activity=$('sActivity').value.trim();s.addr=$('sAddr').value.trim();\n  s.tel=$('sTel').value.trim();s.mail=$('sMail').value.trim();s.reg=$('sReg').value.trim();\n  s.currency=$('sCur').value.trim()||'ريال';s.foot=$('sFoot').value.trim();\n  save();applyTitle();toast('تم الحفظ');\n}\nfunction removeLogo(){db.settings.logo='';save();fillSettings();applyTitle();toast('تمت إزالة اللوجو')}\n$('sLogoFile').addEventListener('change',ev=>{\n  const f=ev.target.files[0];if(!f)return;\n  const r=new FileReader();\n  r.onload=()=>{\n    const img=new Image();\n    img.onload=()=>{\n      const k=Math.min(1,500/Math.max(img.width,img.height));\n      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);\n      c.getContext('2d').drawImage(img,0,0,c.width,c.height);\n      db.settings.logo=c.toDataURL('image/png');save();fillSettings();applyTitle();toast('تم رفع اللوجو');\n    };\n    img.onerror=()=>alert('تعذر قراءة الصورة');\n    img.src=r.result;\n  };\n  r.readAsDataURL(f);ev.target.value='';\n});\nfunction orgHeader(){\n  const L=window.PORTAL_LOGO||db.settings.logo;\n  return L?`<div class=\"rep-banner\"><img src=\"${L}\" alt=\"\"><\/div>`:'';\n}\nfunction orgFooter(){\n  const s=db.settings;\n  const a=[s.addr,s.tel&&('هاتف: '+s.tel),s.mail].filter(Boolean).map(esc).join(' &nbsp;|&nbsp; ');\n  if(!a&&!s.foot)return '';\n  return `<div class=\"org-foot\">${s.foot?`<p><b>${esc(s.foot)}<\/b><\/p>`:''}${a?`<p>${a}<\/p>`:''}<p>${esc(s.company)}<\/p><\/div>`;\n}\nfunction applyTitle(){\n  const s=db.settings;\n  $('appTitle').textContent=s.company+' — الحسابات';document.title=s.company;\n  const l=$('appLogo');if(s.logo){l.src=s.logo;l.style.display=''}else{l.style.display='none'}\n}\nfunction dl(text,name,type){\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;\n  document.body.appendChild(a);a.click();a.remove();\n}\nfunction backup(){dl(JSON.stringify(db),'backup-'+today()+'.json','application/json')}\n$('impFile').addEventListener('change',ev=>{\n  const f=ev.target.files[0];if(!f)return;\n  const r=new FileReader();\n  r.onload=()=>{\n    try{\n      const d=JSON.parse(r.result);\n      if(!Array.isArray(d.entries)||!Array.isArray(d.contractors))throw 0;\n      if(!confi , \"advances\": [{\"date\": \"2026-10-11\", \"amount\": 200, \"from_\": \"المهندس / حسام\", \"to\": \"مصطفي بدر\", \"note\": \"سلف من الراتب\"}, {\"date\": \"2026-10-11\", \"amount\": 20, \"from_\": \"ابو احمد\", \"to\": \"مصطفي بدر\", \"note\": \"سلف من الراتب\"}, {\"date\": \"2026-10-14\", \"amount\": 250, \"from_\": \"المهندس / حسام\", \"to\": \"مصطفي بدر\", \"note\": \"سلف من الراتب\"}, {\"date\": \"2026-10-14\", \"amount\": 30, \"from_\": \"ابو احمد\", \"to\": \"مصطفي بدر\", \"note\": \"سلف من الراتب\"}, {\"date\": \"2026-10-16\", \"amount\": 200, \"from_\": \"المهندس / حسام\", \"to\": \"مصطفي بدر\", \"note\": \"سلف من الراتب\"}, {\"date\": \"2026-10-19\", \"amount\": 50, \"from_\": \"العهدة\", \"to\": \"مصطفي بدر\", \"note\": \"سلف من الراتب\"}, {\"date\": \"2026-10-20\", \"amount\": 150, \"from_\": \"المهندس / حسام\", \"to\": \"مصطفي بدر\", \"note\": \"سلف من الراتب\"}, {\"date\": \"2026-10-22\", \"amount\": 400, \"from_\": \"المهندس / حسام\", \"to\": \"مصطفي بدر\", \"note\": \"سلف من الراتب تحويل لمصر\"}, {\"date\": \"2026-10-23\", \"amount\": 500, \"from_\": \"المهندس / حسام\", \"to\": \"مصطفي بدر\", \"note\": \"سلف من الراتب\"}], \"salary\": {\"2026-01\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-02\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-03\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-04\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-05\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-06\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-07\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-08\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-09\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-10\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-11\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}, \"2026-12\": {\"base\": 2500, \"ded\": 0, \"note\": \"\"}}};\n\nconst r2=n=>Math.round((n+Number.EPSILON)*100)/100;\nconst pad=n=>String(n).padStart(2,'0');\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst fmt=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst N=n=>`<span class=\"num\">${fmt(n)}<\/span>`;\nconst pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};\nconst dayName=s=>DAYS[pd(s).getDay()];\nconst dLong=s=>{const d=pd(s);return `${DAYS[d.getDay()]} ${d.getDate()} ${MN[d.getMonth()]}`};\nconst dShort=s=>s.split('-').reverse().join('/');\nconst isoToday=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};\nconst IC={\n  edit:'<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z\"/><\/svg>',\n  del:'<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18\"/><path d=\"M8 6V4h8v2\"/><path d=\"M6 6l1 14h10l1-14\"/><\/svg>'\n};\n\n/* ---------- البيانات ---------- */\nfunction defaults(){return{settings:{employee:'مصطفي بدر',base:2500,vat:15,buyer:'مصطفي بدر',currency:'ريال',categories:DEF_CATS.slice()},projects:[],expenses:[],custody:[],advances:[],employees:[],salary:{},ui:{}}}\nfunction fromSeed(){\n  const d=defaults();\n  if(!SEED)return d;\n  const pid=uid(),eid=uid();\n  d.projects.push({id:pid,name:SEED.project});\n  d.employees.push({id:eid,name:d.settings.employee,base:d.settings.base});\n  SEED.expenses.forEach((e,i)=>d.expenses.push(Object.assign({id:uid(),ts:i,proj:pid},e)));\n  d.custody.push({id:uid(),proj:pid,date:SEED.custody.date,amount:SEED.custody.amount,from:'',note:'العهدة المستلمة'});\n  SEED.advances.forEach(a=>d.advances.push({id:uid(),emp:eid,date:a.date,amount:a.amount,from:a.from_,note:a.note}));\n  Object.keys(SEED.salary).forEach(k=>{const s=SEED.salary[k];if(s.base!==d.settings.base||s.ded||s.note)d.salary[eid+'|'+k]=s});\n  d.ui.proj=pid;\n  return d;\n}\nfunction norm(d){\n  const b=defaults();\n  d=d||{};d.settings=Object.assign(b.settings,d.settings||{});\n  ['projects','expenses','custody','advances'].forEach(k=>{d[k]=Array.isArray(d[k])?d[k]:[]});\n  d.salary=d.salary||{};d.ui=d.ui||{};\n  if(!Array.isArray(d.employees)){\n    const e={id:uid(),name:d.settings.employee,base:d.settings.base};\n    d.employees=[e];\n    const ns={};Object.keys(d.salary).forEach(k=>{ns[/^\\d{4}-\\d{2}$/.test(k)?e.id+'|'+k:k]=d.salary[k]});d.salary=ns;\n  }\n  d.advances.forEach(a=>{if(!a.emp&&d.employees[0])a.emp=d.employees[0].id});\n  if(!d.settings.categories||!d.settings.categories.length)d.settings.categories=DEF_CATS.slice();\n  return d;\n}\nfunction load(){\n  try{const r=localStorage.getItem(KEY);if(r)return norm(JSON.parse(r))}catch(e){}\n  return fromSeed();\n}\nlet db=load();\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('تعذر الحفظ في المتصفح — نزّل نسخة احتياطية')}}\nconst now=new Date();\nconst view={y:now.getFullYear(),m:now.getMonth()+1,tab:'exp',proj:(db.ui.proj&&db.projects.some(p=>p.id===db.ui.proj))?db.ui.proj:(db.projects[0]||{}).id||'',edit:null,q:'',cat:'',emp:(db.employees[0]||{}).id||'',repInit:false};\n\n/* ---------- حسابات ---------- */\nconst mk=()=>`${view.y}-${pad(view.m)}`;\nconst split=e=>{const net=r2(e.total/(1+(e.rate||0)));return{net,vat:r2(e.total-net)}};\nconst byDate=(a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0);\nconst monthExp=()=>db.expenses.filter(e=>e.proj===view.proj&&e.date.startsWith(mk())).sort(byDate);\nconst monthCust=()=>db.custody.filter(c=>c.proj===view.proj&&c.date.startsWith(mk())).sort(byDate);\nconst monthAdv=(key,emp)=>db.advances.filter(a=>a.emp===(emp||view.emp)&&a.date.startsWith(key||mk())).sort(byDate);\nconst curEmp=()=>db.employees.find(e=>e.id===view.emp);\nconst salOf=(k,emp)=>{emp=emp||view.emp;const e=db.employees.find(x=>x.id===emp)||{base:0};return Object.assign({base:e.base,ded:0,note:''},db.salary[emp+'|'+k]||{})};\nconst curProj=()=>db.projects.find(p=>p.id===view.proj);\nconst cur=()=>esc(db.settings.currency);\nfunction expStats(list,cust){\n  let net=0,vat=0,tot=0,fromC=0,cash=0;\n  list.forEach(e=>{const n=e.total/(1+(e.rate||0));net+=n;vat+=e.total-n;tot+=e.total;if(e.pay==='نقداً')cash+=e.total;else fromC+=e.total});\n  const custody=cust.reduce((a,c)=>a+c.amount,0);\n  return{net:r2(net),vat:r2(vat),tot:r2(tot),fromC:r2(fromC),cash:r2(cash),custody:r2(custody),remain:r2(custody-fromC)};\n}\nfunction salStats(key,emp){\n  emp=emp||view.emp;\n  const s=salOf(key,emp),adv=r2(monthAdv(key,emp).reduce((a,x)=>a+x.amount,0));\n  return{base:s.base,ded:s.ded,adv,net:r2(s.base-s.ded-adv),note:s.note,paid:s.paid||null};\n}\nconst catColor=c=>{const i=db.settings.categories.indexOf(c);return i<0?'#6b7a7f':PAL[i%PAL.length]};\nfunction defDate(){const t=isoToday();return t.startsWith(mk())?t:`${mk()}-01`}\n\n/* ---------- واجهة عامة ---------- */\nfunction toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}\nfunction modal(title,body,onSave,label){\n  const f=$('mf');\n  f.innerHTML=`<h3>${title}<\/h3>${body}<div class=\"actions\"><button class=\"btn\">${label||'حفظ'}<\/button><button type=\"button\" class=\"btn ghost\" id=\"mx\">إلغاء<\/button><\/div>`;\n  $('mx').onclick=()=>$('dlg').close();\n  f.onsubmit=e=>{e.preventDefault();if(onSave(new FormData(f))!==false)$('dlg').close()};\n  $('dlg').showModal();\n  const i=f.querySelector('input');if(i)i.focus();\n}\nconst fld=(l,h)=>`<label class=\"f\"><span>${l}<\/span>${h}<\/label>`;\nfunction download(text,name,type){\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;\n  document.body.appendChild(a);a.click();a.remove();\n}\nfunction csv(rows,name){\n  const q=v=>'\"'+String(v==null?'':v).replace(/\"/g,'\"\"')+'\"';\n  download('﻿'+rows.map(r=>r.map(q).join(',')).join('\\r\\n'),name,'text/csv;charset=utf-8');\n}\nfunction doPrint(html,orient){\n  $('printArea').innerHTML=(window.PORTAL_LOGO?'<img class=\"phl\" src=\"'+window.PORTAL_LOGO+'\" alt=\"\">':'')+html;\n  $('pgStyle').textContent=`@page{size:A4 ${orient};margin:12mm}`;\n  setTimeout(()=>window.print(),60);\n}\n\n/* ---------- التنقل ---------- */\nfunction syncNav(){\n  $('selM').innerHTML=MN.map((n,i)=>`<option value=\"${i+1}\">${n}<\/option>`).join('');\n  const ys=new Set([view.y-1,view.y,view.y+1,2025,2026,2027]);\n  db.expenses.concat(db.advances,db.custody).forEach(x=>ys.add(+x.date.slice(0,4)));\n  $('selY').innerHTML=[...ys].sort().map(y=>`<option>${y}<\/option>`).join('');\n  $('selM').value=view.m;$('selY').value=view.y;\n  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===view.tab?'page':'false'));\n  document.querySelectorAll('.page').forEach(p=>p.hidden=p.id!=='pg-'+view.tab);\n  const p=curProj();\n  $('brandSub').textContent=view.tab==='exp'?(p?p.name:'أضف مشروعاً للبدء'):view.tab==='sal'?`${(curEmp()||{name:'أضف موظفاً'}).name} — الراتب والسلف`:view.tab==='rep'?'تقارير المصروفات':'الإعدادات';\n}\nfunction step(d){view.m+=d;if(view.m>12){view.m=1;view.y++}if(view.m<1){view.m=12;view.y--}if(!view.edit)$('xDate').value=defDate();render()}\n$('prevM').onclick=()=>step(-1);$('nextM').onclick=()=>step(1);\n$('selM').onchange=e=>{view.m=+e.target.value;if(!view.edit)$('xDate').value=defDate();render()};\n$('selY').onchange=e=>{view.y=+e.target.value;if(!view.edit)$('xDate').value=defDate();render()};\n$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){view.tab=b.dataset.t;render();window.scrollTo(0,0)}};\n\nfunction render(){\n  syncNav();\n  if(view.tab==='exp'){renderProj();renderExp()}\n  if(view.tab==='rep')renderRep();\n  if(view.tab==='sal')renderSal();\n  if(view.tab==='set')renderSet();\n}\n\n/* ---------- المشاريع ---------- */\nfunction renderProj(){\n  $('projSel').innerHTML=db.projects.length?db.projects.map(p=>`<option value=\"${p.id}\"${p.id===view.proj?' selected':''}>${esc(p.name)}<\/option>`).join(''):'<option value=\"\">لا يوجد مشروع<\/option>';\n}\n$('projSel').onchange=e=>{view.proj=e.target.value;db.ui.proj=view.proj;save();render()};\nfunction projModal(id){\n  const p=id?db.projects.find(x=>x.id===id):null;\n  modal(p?'تعديل اسم المشروع':'مشروع جديد',\n    fld('اسم المشروع',`<input name=\"name\" required value=\"${esc(p?p.name:'')}\">`)+\n    (p?'':fld('العهدة المستلمة لهذا المشروع (اختياري)',`<input type=\"number\" name=\"cust\" step=\"0.01\" min=\"0\" inputmode=\"decimal\">`)+fld('تاريخ استلام العهدة',`<input type=\"date\" name=\"cdate\" value=\"${isoToday()}\">`)),\n    fd=>{\n      const name=fd.get('name').trim();if(!name)return false;\n      if(p)p.name=name;\n      else{\n        const n={id:uid(),name};db.projects.push(n);view.proj=n.id;db.ui.proj=n.id;\n        const a=parseFloat(fd.get('cust'));\n        if(a>0){const dt=fd.get('cdate')||isoToday();db.custody.push({id:uid(),proj:n.id,date:dt,amount:r2(a),from:'',note:'عهدة المشروع'});view.y=+dt.slice(0,4);view.m=+dt.slice(5,7)}\n      }\n      save();render();toast('تم الحفظ');\n    });\n}\n$('projAdd').onclick=()=>projModal();$('projAdd2').onclick=()=>projModal();\n\n/* ---------- المصروفات ---------- */\nfunction renderExp(){\n  const list=monthExp(),cust=monthCust(),st=expStats(list,cust),c=cur();\n  const pct=st.custody>0?st.fromC/st.custody:(st.fromC>0?1.01:0);\n  const end=mk()+'-31';\n  const cum=r2(db.custody.filter(c=>c.proj===view.proj&&c.date<=end).reduce((a,c)=>a+c.amount,0)-db.expenses.filter(e=>e.proj===view.proj&&e.date<=end&&e.pay!=='نقداً').reduce((a,e)=>a+e.total,0));\n  const cls=st.remain<0?'over':(pct>=.9&&st.custody>0?'low':'');\n  const note=!st.custody?'لم تُسجَّل عهدة لهذا الشهر':st.remain<0?'المصروف تجاوز العهدة':cls==='low'?'العهدة أوشكت على النفاد':'';\n  $('expSummary').innerHTML=`<section class=\"panel custody ${cls}\">\n    <div class=\"cm\">\n      <div class=\"remain\"><div class=\"lbl\">المتبقي من العهدة<\/div><div class=\"big\">${N(st.remain)} <small>${c}<\/small><\/div><div class=\"hint\">${note}<\/div><div class=\"hint\">رصيد عهدة المشروع حتى نهاية الشهر: <b class=\"${cum<0?'net-neg':''}\">${N(cum)}<\/b><\/div><\/div>\n      <div class=\"gwrap\"><div class=\"gauge\"><i style=\"width:${Math.min(pct,1)*100}%\"><\/i><\/div>\n      <div class=\"gleg\"><span>صُرف من العهدة <b>${N(st.fromC)}<\/b><\/span><span>المستلم <b>${N(st.custody)}<\/b><\/span><\/div><\/div>\n    <\/div>\n    <dl class=\"stats\">\n      <div><dt>إجمالي المصروفات<\/dt><dd>${N(st.tot)}<\/dd><\/div>\n      <div><dt>قبل الضريبة<\/dt><dd>${N(st.net)}<\/dd><\/div>\n      <div><dt>الضريبة<\/dt><dd>${N(st.vat)}<\/dd><\/div>\n      <div><dt>مدفوع نقداً من جيبك<\/dt><dd>${N(st.cash)}<\/dd><\/div>\n    <\/dl>\n    <div class=\"clist\"><span class=\"lbl\">العهدة المستلمة<\/span>\n      ${cust.map(x=>`<span class=\"cpill\">${dShort(x.date)} · ${N(x.amount)}${x.from?' · '+esc(x.from):''}<button class=\"ib\" data-ce=\"${x.id}\" aria-label=\"تعديل\">${IC.edit}<\/button><button class=\"ib d\" data-cd=\"${x.id}\" aria-label=\"حذف\">${IC.del}<\/button><\/span>`).join('')}\n      <button class=\"btn ghost sm\" id=\"custAdd\" type=\"button\">+ عهدة<\/button><\/div>\n  <\/section>`;\n  // قوائم الإكمال والتصنيفات\n  const cats=db.settings.categories;\n  const keep=$('xCat').value;\n  $('xCat').innerHTML=cats.map(x=>`<option>${esc(x)}<\/option>`).join('');\n  if(cats.includes(keep))$('xCat').value=keep;\n  const fv=$('fcat').value;\n  $('fcat').innerHTML='<option value=\"\">كل التصنيفات<\/option>'+cats.map(x=>`<option>${esc(x)}<\/option>`).join('');\n  $('fcat').value=cats.includes(fv)?fv:'';\n  view.cat=$('fcat').value;\n  $('dlDesc').innerHTML=[...new Set(db.expenses.map(e=>e.desc))].slice(-300).map(d=>`<option value=\"${esc(d)}\">`).join('');\n  $('dlBuyer').innerHTML=[...new Set(db.expenses.map(e=>e.buyer).concat(db.settings.buyer).filter(Boolean))].map(d=>`<option value=\"${esc(d)}\">`).join('');\n  if(!$('xBuyer').value&&!view.edit)$('xBuyer').value=db.settings.buyer;\n  if(!$('xDate').value)$('xDate').value=defDate();\n  renderList(list);\n  calc();\n}\nfunction renderList(all){\n  all=all||monthExp();\n  const q=view.q.trim();\n  let list=all.filter(e=>(!view.cat||e.cat===view.cat)&&(!q||[e.desc,e.inv,e.buyer,e.note,e.cat].join(' ').includes(q)));\n  if(!list.length){$('expList').innerHTML=`<div class=\"empty\">${all.length?'لا توجد نتائج مطابقة':'لا توجد مصروفات في هذا الشهر. أضف أول مصروف من النموذج أعلاه.'}<\/div>`;return}\n  let h='',last='',dsum=0,i=0;\n  const days={};list.forEach(e=>{days[e.date]=r2((days[e.date]||0)+e.total)});\n  list.forEach(e=>{\n    if(e.date!==last){h+=`<div class=\"day\"><b>${dLong(e.date)}<\/b><span>إجمالي اليوم ${N(days[e.date])}<\/span><\/div>`;last=e.date}\n    i++;const s=split(e);\n    const noinv=!e.inv||e.inv==='بدون فاتورة';\n    h+=`<div class=\"row\"><div class=\"idx\">${i}<\/div>\n      <div><div class=\"rt\">${esc(e.desc)}<\/div><div class=\"rm\"><span class=\"cat\" style=\"--c:${catColor(e.cat)}\">${esc(e.cat)}<\/span>\n      <span class=\"tg${noinv?' warn':''}\">${noinv?'بدون فاتورة':'فاتورة '+esc(e.inv)}<\/span>\n      ${e.pay==='نقداً'?'<span class=\"tg warn\">نقداً<\/span>':''}${e.rate?'':'<span class=\"tg\">بدون ضريبة<\/span>'}\n      ${e.buyer&&e.buyer!==db.settings.buyer?`<span>${esc(e.buyer)}<\/span>`:''}${e.note?`<span>${esc(e.note)}<\/span>`:''}<\/div><\/div>\n      <div class=\"amt\">${fmt(e.total)}<small>ضريبة ${fmt(s.vat)}<\/small><\/div>\n      <div class=\"ra\"><button class=\"ib\" data-ed=\"${e.id}\" aria-label=\"تعديل\">${IC.edit}<\/button><button class=\"ib d\" data-dl=\"${e.id}\" aria-label=\"حذف\">${IC.del}<\/button><\/div><\/div>`;\n  });\n  $('expList').innerHTML=h;\n}\n$('q').oninput=e=>{view.q=e.target.value;renderList()};\n$('fcat').onchange=e=>{view.cat=e.target.value;renderList()};\n\n// نموذج الإدخال\nconst vm=()=>document.querySelector('input[name=vm]:checked').value;\nfunction calc(){\n  const a=parseFloat($('xAmt').value),m=vm(),rate=m==='none'?0:db.settings.vat/100;\n  if(!(a>0)){$('xCalc').innerHTML=m==='none'?'':`الضريبة المطبّقة <b>${db.settings.vat}%<\/b>`;return}\n  const total=m==='excl'?r2(a*(1+rate)):r2(a),net=r2(total/(1+rate));\n  $('xCalc').innerHTML=`قبل الضريبة <b>${fmt(net)}<\/b> + ضريبة <b>${fmt(total-net)}<\/b> = الإجمالي <b>${fmt(total)}<\/b>`;\n}\n$('xAmt').oninput=calc;\ndocument.querySelectorAll('input[name=vm]').forEach(r=>r.onchange=calc);\n$('xNoInv').onclick=()=>{\n  const on=$('xInv').value==='بدون فاتورة';\n  $('xInv').value=on?'':'بدون فاتورة';\n};\n$('xInv').oninput=()=>$('xNoInv').classList.toggle('on',$('xInv').value==='بدون فاتورة');\n$('xDesc').onchange=()=>{\n  const v=$('xDesc').value.trim();if(!v||view.edit)return;\n  const p=[...db.expenses].reverse().find(e=>e.desc.trim()===v);\n  if(p){if(db.settings.categories.includes(p.cat))$('xCat').value=p.cat;if(!$('xAmt').value){$('xAmt').value=p.total;document.querySelector('input[name=vm][value=incl]').checked=true;calc()}}\n};\nfunction resetForm(keepDate){\n  view.edit=null;\n  $('xf').classList.remove('edit');$('xfTitle').textContent='مصروف جديد';$('xSave').textContent='إضافة المصروف';$('xCancel').hidden=true;\n  ['xDesc','xAmt','xInv','xNote'].forEach(i=>$(i).value='');\n  $('xNoInv').classList.remove('on');\n  document.querySelector('input[name=vm][value=incl]').checked=true;\n  $('xBuyer').value=db.settings.buyer;\n  if(!keepDate)$('xDate').value=defDate();\n  calc();\n}\n$('xCancel').onclick=()=>resetForm();\n$('xf').onsubmit=e=>{\n  e.preventDefault();\n  if(!view.proj)return toast('أضف مشروعاً أولاً');\n  const a=parseFloat($('xAmt').value);if(!(a>0))return toast('أدخل المبلغ');\n  const m=vm(),rate=m==='none'?0:db.settings.vat/100,total=m==='excl'?r2(a*(1+rate)):r2(a);\n  const o={proj:view.proj,date:$('xDate').value,cat:$('xCat').value,desc:$('xDesc').value.trim(),buyer:$('xBuyer').value.trim(),total,rate,inv:$('xInv').value.trim(),pay:$('xPay').value,note:$('xNote').value.trim()};\n  if(view.edit){Object.assign(db.expenses.find(x=>x.id===view.edit),o);toast('تم حفظ التعديل')}\n  else{db.expenses.push(Object.assign({id:uid(),ts:Date.now()},o));toast('تمت الإضافة')}\n  save();\n  view.y=+o.date.slice(0,4);view.m=+o.date.slice(5,7);\n  const wasEdit=!!view.edit;\n  resetForm(true);\n  render();\n  if(!wasEdit)$('xDesc').focus();\n};\n$('expList').onclick=e=>{\n  const ed=e.target.closest('[data-ed]'),dl=e.target.closest('[data-dl]');\n  if(ed){\n    const x=db.expenses.find(t=>t.id===ed.dataset.ed);if(!x)return;\n    view.edit=x.id;\n    $('xf').classList.add('edit');$('xfTitle').textContent='تعديل مصروف';$('xSave').textContent='حفظ التعديل';$('xCancel').hidden=false;\n    $('xDesc').value=x.desc;$('xAmt').value=x.total;$('xDate').value=x.date;\n    if(!db.settings.categories.includes(x.cat))$('xCat').insertAdjacentHTML('beforeend',`<option>${esc(x.cat)}<\/option>`);\n    $('xCat').value=x.cat;$('xPay').value=x.pay;$('xInv').value=x.inv;$('xBuyer').value=x.buyer;$('xNote').value=x.note||'';\n    $('xNoInv').classList.toggle('on',x.inv==='بدون فاتورة');\n    document.querySelector(`input[name=vm][value=${x.rate?'incl':'none'}]`).checked=true;\n    calc();$('xf').scrollIntoView({behavior:'smooth',block:'center'});$('xDesc').focus();\n  }\n  if(dl&&confirm('حذف هذا المصروف؟')){db.expenses=db.expenses.filter(t=>t.id!==dl.dataset.dl);if(view.edit===dl.dataset.dl)resetForm();save();render();toast('تم الحذف')}\n};\n\n// العهدة\nfunction custModal(id){\n  const c=id?db.custody.find(x=>x.id===id):null;\n  modal(c?'تعديل عهدة':'عهدة مستلمة',\n    fld('التاريخ',`<input type=\"date\" name=\"date\" required value=\"${c?c.date:defDate()}\">`)+\n    fld('المبلغ',`<input type= n  if(view.tab==='set')renderSet();\n}\n\n/* ---------- المشاريع ---------- */\nfunction renderProj(){\n  $('projSel').innerHTML=db.projects.length?db.projects.map(p=>`<option value=\"${p.id}\"${p.id===view.proj?' selected':''}>${esc(p.name)}<\/option>`).join(''):'<option value=\"\">لا يوجد مشروع<\/option>';\n}\n$('projSel').onchange=e=>{view.proj=e.target.value;db.ui.proj=view.proj;save();render()};\nfunction projModal(id){\n  const p=id?db.projects.find(x=>x.id===id):null;\n  modal(p?'تعديل اسم المشروع':'مشروع جديد',\n    fld('اسم المشروع',`<input name=\"name\" required value=\"${esc(p?p.name:'')}\">`)+\n    (p?'':fld('العهدة المستلمة لهذا المشروع (اختياري)',`<input type=\"number\" name=\"cust\" step=\"0.01\" min=\"0\" inputmode=\"decimal\">`)+fld('تاريخ استلام العهدة',`<input type=\"date\" name=\"cdate\" value=\"${isoToday()}\">`)),\n    fd=>{\n      const name=fd.get('name').trim();if(!name)return false;\n      if(p)p.name=name;\n      else{\n        const n={id:uid(),name};db.projects.push(n);view.proj=n.id;db.ui.proj=n.id;\n        const a=parseFloat(fd.get('cust'));\n        if(a>0){const dt=fd.get('cdate')||isoToday();db.custody.push({id:uid(),proj:n.id,date:dt,amount:r2(a),from:'',note:'عهدة المشروع'});view.y=+dt.slice(0,4);view.m=+dt.slice(5,7)}\n      }\n      save();render();toast('تم الحفظ');\n    });\n}\n$('projAdd').onclick=()=>projModal();$('projAdd2').onclick=()=>projModal();\n\n/* ---------- المصروفات ---------- */\nfunction renderExp(){\n  const list=monthExp(),cust=monthCust(),st=expStats(list,cust),c=cur();\n  const pct=st.custody>0?st.fromC/st.custody:(st.fromC>0?1.01:0);\n  const end=mk()+'-31';\n  const cum=r2(db.custody.filter(c=>c.proj===view.proj&&c.date<=end).reduce((a,c)=>a+c.amount,0)-db.expenses.filter(e=>e.proj===view.proj&&e.date<=end&&e.pay!=='نقداً').reduce((a,e)=>a+e.total,0));\n  const cls=st.remain<0?'over':(pct>=.9&&st.custody>0?'low':'');\n  const note=!st.custody?'لم تُسجَّل عهدة لهذا الشهر':st.remain<0?'المصروف تجاوز العهدة':cls==='low'?'العهدة أوشكت على النفاد':'';\n  $('expSummary').innerHTML=`<section class=\"panel custody ${cls}\">\n    <div class=\"cm\">\n      <div class=\"remain\"><div class=\"lbl\">المتبقي من العهدة<\/div><div class=\"big\">${N(st.remain)} <small>${c}<\/small><\/div><div class=\"hint\">${note}<\/div><div class=\"hint\">رصيد عهدة المشروع حتى نهاية الشهر: <b class=\"${cum<0?'net-neg':''}\">${N(cum)}<\/b><\/div><\/div>\n      <div class=\"gwrap\"><div class=\"gauge\"><i style=\"width:${Math.min(pct,1)*100}%\"><\/i><\/div>\n      <div class=\"gleg\"><span>صُرف من العهدة <b>${N(st.fromC)}<\/b><\/span><span>المستلم <b>${N(st.custody)}<\/b><\/span><\/div><\/div>\n    <\/div>\n    <dl class=\"stats\">\n      <div><dt>إجمالي المصروفات<\/dt><dd>${N(st.tot)}<\/dd><\/div>\n      <div><dt>قبل الضريبة<\/dt><dd>${N(st.net)}<\/dd><\/div>\n      <div><dt>الضريبة<\/dt><dd>${N(st.vat)}<\/dd><\/div>\n      <div><dt>مدفوع نقداً من جيبك<\/dt><dd>${N(st.cash)}<\/dd><\/div>\n    <\/dl>\n    <div class=\"clist\"><span class=\"lbl\">العهدة المستلمة<\/span>\n      ${cust.map(x=>`<span class=\"cpill\">${dShort(x.date)} · ${N(x.amount)}${x.from?' · '+esc(x.from):''}<button class=\"ib\" data-ce=\"${x.id}\" aria-label=\"تعديل\">${IC.edit}<\/button><button class=\"ib d\" data-cd=\"${x.id}\" aria-label=\"حذف\">${IC.del}<\/button><\/span>`).join('')}\n      <button class=\"btn ghost sm\" id=\"custAdd\" type=\"button\">+ عهدة<\/button><\/div>\n  <\/section>`;\n  // قوائم الإكمال والتصنيفات\n  const cats=db.settings.categories;\n  const keep=$('xCat').value;\n  $('xCat').innerHTML=cats.map(x=>`<option>${esc(x)}<\/option>`).join('');\n  if(cats.includes(keep))$('xCat').value=keep;\n  const fv=$('fcat').value;\n  $('fcat').innerHTML='<option value=\"\">كل التصنيفات<\/option>'+cats.map(x=>`<option>${esc(x)}<\/option>`).join('');\n  $('fcat').value=cats.includes(fv)?fv:'';\n  view.cat=$('fcat').value;\n  $('dlDesc').innerHTML=[...new Set(db.expenses.map(e=>e.desc))].slice(-300).map(d=>`<option value=\"${esc(d)}\">`).join('');\n  $('dlBuyer').innerHTML=[...new Set(db.expenses.map(e=>e.buyer).concat(db.settings.buyer).filter(Boolean))].map(d=>`<option value=\"${esc(d)}\">`).join('');\n  if(!$('xBuyer').value&&!view.edit)$('xBuyer').value=db.settings.buyer;\n  if(!$('xDate').value)$('xDate').value=defDate();\n  renderList(list);\n  calc();\n}\nfunction renderList(all){\n  all=all||monthExp();\n  const q=view.q.trim();\n  let list=all.filter(e=>(!view.cat||e.cat===view.cat)&&(!q||[e.desc,e.inv,e.buyer,e.note,e.cat].join(' ').includes(q)));\n  if(!list.length){$('expList').innerHTML=`<div class=\"empty\">${all.length?'لا توجد نتائج مطابقة':'لا توجد مصروفات في هذا الشهر. أضف أول مصروف من النموذج أعلاه.'}<\/div>`;return}\n  let h='',last='',dsum=0,i=0;\n  const days={};list.forEach(e=>{days[e.date]=r2((days[e.date]||0)+e.total)});\n  list.forEach(e=>{\n    if(e.date!==last){h+=`<div class=\"day\"><b>${dLong(e.date)}<\/b><span>إجمالي اليوم ${N(days[e.date])}<\/span><\/div>`;last=e.date}\n    i++;const s=split(e);\n    const noinv=!e.inv||e.inv==='بدون فاتورة';\n    h+=`<div class=\"row\"><div class=\"idx\">${i}<\/div>\n      <div><div class=\"rt\">${esc(e.desc)}<\/div><div class=\"rm\"><span class=\"cat\" style=\"--c:${catColor(e.cat)}\">${esc(e.cat)}<\/span>\n      <span class=\"tg${noinv?' warn':''}\">${noinv?'بدون فاتورة':'فاتورة '+esc(e.inv)}<\/span>\n      ${e.pay==='نقداً'?'<span class=\"tg warn\">نقداً<\/span>':''}${e.rate?'':'<span class=\"tg\">بدون ضريبة<\/span>'}\n      ${e.buyer&&e.buyer!==db.settings.buyer?`<span>${esc(e.buyer)}<\/span>`:''}${e.note?`<span>${esc(e.note)}<\/span>`:''}<\/div><\/div>\n      <div class=\"amt\">${fmt(e.total)}<small>ضريبة ${fmt(s.vat)}<\/small><\/div>\n      <div class=\"ra\"><button class=\"ib\" data-ed=\"${e.id}\" aria-label=\"تعديل\">${IC.edit}<\/button><button class=\"ib d\" data-dl=\"${e.id}\" aria-label=\"حذف\">${IC.del}<\/button><\/div><\/div>`;\n  });\n  $('expList').innerHTML=h;\n}\n$('q').oninput=e=>{view.q=e.target.value;renderList()};\n$('fcat').onchange=e=>{view.cat=e.target.value;renderList()};\n\n// نموذج الإدخال\nconst vm=()=>document.querySelector('input[name=vm]:checked').value;\nfunction calc(){\n  const a=parseFloat($('xAmt').value),m=vm(),rate=m==='none'?0:db.settings.vat/100;\n  if(!(a>0)){$('xCalc').innerHTML=m==='none'?'':`الضريبة المطبّقة <b>${db.settings.vat}%<\/b>`;return}\n  const total=m==='excl'?r2(a*(1+rate)):r2(a),net=r2(total/(1+rate));\n  $('xCalc').innerHTML=`قبل الضريبة <b>${fmt(net)}<\/b> + ضريبة <b>${fmt(total-net)}<\/b> = الإجمالي <b>${fmt(total)}<\/b>`;\n}\n$('xAmt').oninput=calc;\ndocument.querySelectorAll('input[name=vm]').forEach(r=>r.onchange=calc);\n$('xNoInv').onclick=()=>{\n  const on=$('xInv').value==='بدون فاتورة';\n  $('xInv').value=on?'':'بدون فاتورة';\n};\n$('xInv').oninput=()=>$('xNoInv').classList.toggle('on',$('xInv').value==='بدون فاتورة');\n$('xDesc').onchange=()=>{\n  const v=$('xDesc').value.trim();if(!v||view.edit)return;\n  const p=[...db.expenses].reverse().find(e=>e.desc.trim()===v);\n  if(p){if(db.settings.categories.includes(p.cat))$('xCat').value=p.cat;if(!$('xAmt').value){$('xAmt').value=p.total;document.querySelector('input[name=vm][value=incl]').checked=true;calc()}}\n};\nfunction resetForm(keepDate){\n  view.edit=null;\n  $('xf').classList.remove('edit');$('xfTitle').textContent='مصروف جديد';$('xSave').textContent='إضافة المصروف';$('xCancel').hidden=true;\n  ['xDesc','xAmt','xInv','xNote'].forEach(i=>$(i).value='');\n  $('xNoInv').classList.remove('on');\n  document.querySelector('input[name=vm][value=incl]').checked=true;\n  $('xBuyer').value=db.settings.buyer;\n  if(!keepDate)$('xDate').value=defDate();\n  calc();\n}\n$('xCancel').onclick=()=>resetForm();\n$('xf').onsubmit=e=>{\n  e.preventDefault();\n  if(!view.proj)return toast('أضف مشروعاً أولاً');\n  const a=parseFloat($('xAmt').value);if(!(a>0))return toast('أدخل المبلغ');\n  const m=vm(),rate=m==='none'?0:db.settings.vat/100,total=m==='excl'?r2(a*(1+rate)):r2(a); al\" required value=\"${c?c.amount:''}\">`)+\n    fld('المستلَم من',`<input name=\"from\" value=\"${esc(c?c.from:'')}\" placeholder=\"اختياري\">`)+\n    fld('ملاحظات',`<input name=\"note\" value=\"${esc(c?c.note:'')}\">`),\n    fd=>{const o={date:fd.get('date'),amount:r2(parseFloat(fd.get('amount'))),from:fd.get('from').trim(),note:fd.get('note').trim()};\n      if(!(o.amount>0))return false;\n      if(c)Object.assign(c,o);else db.custody.push(Object.assign({id:uid(),proj:view.proj},o));\n      view.y=+o.date.slice(0,4);view.m=+o.date.slice(5,7);save();render();toast('تم الحفظ')});\n}\n$('expSummary').onclick=e=>{\n  if(e.target.closest('#custAdd')){if(!view.proj)return toast('أضف مشروعاً أولاً');custModal()}\n  const ce=e.target.closest('[data-ce]'),cd=e.target.closest('[data-cd]');\n  if(ce)custModal(ce.dataset.ce);\n  if(cd&&confirm('حذف هذه العهدة؟')){db.custody=db.custody.filter(x=>x.id!==cd.dataset.cd);save();render()}\n};\n\n// طباعة وتصدير المصروفات\nfunction printExp(){\n  const list=monthExp(),st=expStats(list,monthCust()),p=curProj()||{name:''};\n  let i=0;\n  const rows=list.map(e=>{const s=split(e);i++;return `<tr><td>${i}<\/td><td>${dShort(e.date)}<\/td><td>${dayName(e.date)}<\/td><td>${esc(e.inv)}<\/td><td>${esc(e.cat)}<\/td><td>${esc(e.desc)}<\/td><td>${esc(e.buyer)}<\/td><td class=\"n\">${fmt(s.net)}<\/td><td class=\"n\">${fmt(s.vat)}<\/td><td class=\"n\">${fmt(e.total)}<\/td><td>${esc(e.pay)}<\/td><td>${esc(e.note)}<\/td><\/tr>`}).join('');\n  const by={};list.forEach(e=>{by[e.cat]=by[e.cat]||{n:0,v:0,t:0};const s=split(e);by[e.cat].n+=s.net;by[e.cat].v+=s.vat;by[e.cat].t+=e.total});\n  const cs=Object.keys(by).map(k=>`<tr><td>${esc(k)}<\/td><td class=\"n\">${fmt(by[k].n)}<\/td><td class=\"n\">${fmt(by[k].v)}<\/td><td class=\"n\">${fmt(by[k].t)}<\/td><\/tr>`).join('');\n  doPrint(`<div class=\"ph\"><h1>سجل المصاريف الشهرية — الموقع<\/h1><p>المشروع: <b>${esc(p.name)}<\/b> &nbsp;|&nbsp; الشهر: <b>${MN[view.m-1]} ${view.y}<\/b> &nbsp;|&nbsp; المسؤول: (mk());\n  const rows=[['الموظف','الشهر','الراتب الأساسي','الخصومات الثابتة','السلف','قسط السلفة','المتبقي من السلفة','الصافي'],[emp.name,mk(),st.base,st.ded,st.adv,st.loan,st.loanRemain,st.net],[],['م','الموظف','الوظيفة','التاريخ','اليوم','المبلغ','المسلِّم','ملاحظات']].concat(list.map((a,i)=>[i+1,emp.name,emp.job||'',a.date,dayName(a.date),a.amount,a.from,a.note]));\n  csv(rows,`رواتب-${emp.name}-${mk()}.csv`);\n};\n\n/* ---------- الإعدادات ---------- */\nfunction renderSet(){\n  const s=db.settings;\n  $('sEmp').value=s.employee;$('sVat').value=s.vat;$('sBuyer').value=s.buyer;$('sCur').value=s.currency;$('sCats').value=s.categories.join('\\n');\n  $('projList').innerHTML=db.projects.length?db.projects.map(p=>`<div><span>${esc(p.name)}<\/span><button class=\"ib\" data-pe=\"${p.id}\" aria-label=\"تعديل\">${IC.edit}<\/button><button class=\"ib d\" data-pd=\"${p.id}\" aria-label=\"حذف\">${IC.del}<\/button><\/div>`).join(''):'<div class=\"hint\" style=\"border:0;background:none\">لا توجد مشاريع.<\/div>';\n  $('empList').innerHTML=db.employees.length?db.employees.map(e=>`<div><span>${esc(e.name)} <small class=\"hint\">${e.job?'— '+esc(e.job)+' ':''}— الراتب ${fmt(e.base)}<\/small><\/span><button class=\"ib\" data-ee=\"${e.id}\" aria-label=\"تعديل\">${IC.edit}<\/button><button class=\"ib d\" data-ex=\"${e.id}\" aria-label=\"حذف\">${IC.del}<\/button><\/div>`).join(''):'<div class=\"hint\" style=\"border:0;background:none\">لا يوجد موظفون.<\/div>';\n}\n$('sSave').onclick=()=>{\n  const s=db.settings;\n  s.employee=$('sEmp').value.trim()||'المسؤول';\n  const v=parseFloat($('sVat').value);s.vat=isNaN(v)?15:v;\n  s.buyer=$('sBuyer').value.trim();s.currency=$('sCur').value.trim()||'ريال';\n  const cats=$('sCats').value.split('\\n').map(x=>x.trim()).filter(Boolean);\n  s.categories=cats.length?[...new Set(cats)]:DEF_CATS.slice();\n  save();render();toast('تم حفظ الإعدادات');\n};\n$('projList').onclick=e=>{\n  const pe=e.target.closest('[data-pe]'),pdl=e.target.closest('[data-pd]');\n  if(pe)projModal(pe.dataset.pe);\n  if(pdl){\n    const id=pdl.dataset.pd;\n    if(db.expenses.some(x=>x.proj===id)||db.custody.some(x=>x.proj===id))return alert('لا يمكن حذف مشروع عليه مصروفات أو عهدة. احذفها أولاً.');\n    if(!confirm('حذف المشروع؟'))return;\n    db.projects=db.projects.filter(p=>p.id!==id);\n    if(view.proj===id){view.proj=(db.projects[0]||{}).id||'';db.ui.proj=view.proj}\n    save();render();\n  }\n};\n$('empList').onclick=e=>{\n  const ee=e.target.closest('[data-ee]'),ex=e.target.closest('[data-ex]');\n  if(ee)empModal(ee.dataset.ee);\n  if(ex){\n    const id=ex.dataset.ex;\n    if(db.advances.some(a=>a.emp===id)||db.loans.some(a=>a.emp===id))return alert('لا يمكن حذف موظف عليه سلف. احذف سلفه أولاً.');\n    if(!confirm('حذف الموظف؟'))return;\n    db.employees=db.employees.filter(x=>x.id!==id);\n    Object.keys(db.salary).forEach(k=>{if(k.startsWith(id+'|'))delete db.salary[k]});\n    if(view.emp===id)view.emp=(db.employees[0]||{}).id||'';\n    save();render();\n  }\n};\n$('bkp').onclick=()=>download(JSON.stringify(db),`الرواتب-والسلف-${isoToday()}.json`,'application/json');\n$('imp').onchange=e=>{\n  const f=e.target.files[0];if(!f)return;\n  const r=new FileReader();\n  r.onload=()=>{\n    try{\n      const d=JSON.parse(r.result);\n      if(!Array.isArray(d.expenses)||!Array.isArray(d.projects))throw 0;\n      if(!confirm('سيتم استبدال كل البيانات الحالية بالنسخة المستوردة. متأكد؟'))return;\n      db=norm(d);view.proj=(db.projects[0]||{}).id||'';view.emp=(db.employees[0]||{}).id||'';db.ui.proj=view.proj;save();resetForm();render();toast('تم الاستيراد');\n    }catch(x){alert('الملف غير صالح')}\n  };\n  r.readAsText(f);e.target.value='';\n};\n$('wipe').onclick=()=>{\n  if(!confirm('سيتم مسح كل البيانات نهائياً. هل أخذت نسخة احتياطية؟'))return;\n  if(!confirm('تأكيد أخير: مسح كل شيء؟'))return;\n  db=defaults();view.proj='';view.emp='';save();resetForm();render();toast('تم المسح');\n};\n\n/* ---------- تشغيل ---------- */\nresetForm();\nrender();\n<\/script>\n<\/body>\n<\/html>\n"};

let BE, me=null, route={v:'home'}, cur=null, unsubUsers=null;
const levelOf=id=>!me?null:me.role==='admin'?'edit':(me.apps&&me.apps[id])||null;

/* ---------- البداية ---------- */
(async function boot(){
  root.innerHTML='<div class="loading" style="min-height:100vh;display:grid;place-items:center;color:#5b6a78">جارٍ التحميل…</div>';
  try{ if(!window.BE_PROMISE)throw new Error('no-backend'); BE=await window.BE_PROMISE }catch(e){ root.innerHTML=`<div class="login"><div class="panel"><h2>تعذّر التحميل</h2><p class="s">لم يتم تحميل مكتبة Firebase. تأكد من اتصال الإنترنت ثم حدّث الصفحة.</p></div></div>`; return }
  if(!BE.configured){ return viewNotConfigured() }
  let first=true;
  BE.onSession(async(u,reason)=>{
    if(u){ me=u; if(first||route.v==='login'||route.v==='setup'){route={v:'home'}} first=false; render(); }
    else{ await closeApp(); me=null; first=false; if(reason==='inactive'){viewLogin(ERR.inactive)} else if(reason&&reason.startsWith('error')){viewLogin('تعذّر قراءة الحساب. تأكد من قواعد Firestore ('+reason+').')} else {try{ (await BE.setupDone())?viewLogin():viewSetup() }catch(e){viewLogin(errMsg(e))}} }
  });
})();

/* ---------- شاشات قبل الدخول ---------- */
const bannerHTML=`<div class="banner"><img src="${LOGO}" alt="مؤسسة بنية الإنشاء المتقدمة للمقاولات العامة"></div>`;
function viewLogin(msg){
  route={v:'login'};
  root.innerHTML=`<div class="login">${bannerHTML}<form class="panel" id="lf"><h2>تسجيل الدخول</h2><p class="s">أدخل اسم المستخدم وكلمة المرور الخاصة بك.</p>
  <label class="f">اسم المستخدم<input class="t ltr" id="lu" autocomplete="username" autocapitalize="none" required></label>
  <label class="f">كلمة المرور<input class="t ltr" id="lp" type="password" autocomplete="current-password" required></label>
  <div class="err" id="le" ${msg?'':'hidden'}>${esc(msg||'')}</div>
  <button class="btn full" id="lb">دخول</button></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();$('#lb').disabled=true;$('#le').hidden=true;
    try{await BE.login($('#lu').value,$('#lp').value)}catch(x){$('#le').textContent=errMsg(x);$('#le').hidden=false;$('#lb').disabled=false}};
  $('#lu').focus();
}
function viewSetup(){
  route={v:'setup'};
  root.innerHTML=`<div class="login">${bannerHTML}<form class="panel" id="sf"><h2>الإعداد لأول مرة</h2><p class="s">أنشئ حساب المدير. هذا الحساب هو الوحيد الذي يستطيع إضافة المستخدمين وتحديد ما يراه كل واحد منهم.</p>
  <label class="f">الاسم<input class="t" id="sn" required></label>
  <label class="f">اسم المستخدم (إنجليزي بدون مسافات)<input class="t ltr" id="su" pattern="[a-zA-Z0-9._\\-]{3,30}" autocapitalize="none" required></label>
  <label class="f">كلمة المرور (6 أحرف على الأقل)<input class="t ltr" id="sp" type="password" minlength="6" required></label>
  <label class="f">تأكيد كلمة المرور<input class="t ltr" id="sp2" type="password" required></label>
  <div class="err" id="se" hidden></div>
  <button class="btn full" id="sb">إنشاء حساب المدير</button></form></div>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();const er=$('#se');er.hidden=true;
    if($('#sp').value!==$('#sp2').value){er.textContent='كلمتا المرور غير متطابقتين.';er.hidden=false;return}
    $('#sb').disabled=true;
    try{await BE.bootstrap($('#su').value,$('#sn').value.trim(),$('#sp').value)}catch(x){er.textContent=errMsg(x);er.hidden=false;$('#sb').disabled=false}};
}
const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function uref(){ return /databases/$(database)/documents/users/$(request.auth.uid); }
    function signedIn(){ return request.auth != null; }
    function me(){ return get(uref()).data; }
    function ok(){ return signedIn() && exists(uref()) && me().active == true; }
    function isAdmin(){ return ok() && me().role == 'admin'; }
    function canApp(a, levels){ return ok() && (me().role == 'admin' || ('apps' in me() && me().apps.get(a,'none') in levels)); }
    function setupDone(){ return exists(/databases/$(database)/documents/meta/setup); }

    match /meta/{d} {
      allow get: if true;
      allow create: if signedIn() && d == 'setup' && !setupDone();
    }
    match /usernames/{u} {
      allow get: if true;
      allow list: if isAdmin();
      allow write: if isAdmin() || (signedIn() && !setupDone());
    }
    match /users/{uid} {
      allow get: if signedIn() && (request.auth.uid == uid || isAdmin());
      allow list: if isAdmin();
      allow create: if isAdmin() || (request.auth.uid == uid && !setupDone() && request.resource.data.role == 'admin');
      allow update, delete: if isAdmin();
    }
    match /apps/{appId} {
      allow read: if canApp(appId, ['edit','view']);
      allow write: if canApp(appId, ['edit']);
      match /kv/{docId} {
        allow read: if canApp(appId, ['edit','view']);
        allow write: if canApp(appId, ['edit']);
      }
    }
  }
}`;
