/* ---------- تشغيل البرنامج داخل الإطار مع المزامنة ---------- */
const Bridge={
 set(app,k,v){ if(!cur||cur.id!==app||cur.ro)return; cur.data[k]=v; cur.dirty.add(k); sched() },
 del(app,k){ if(!cur||cur.id!==app||cur.ro)return; delete cur.data[k]; cur.dirty.add(k); sched() },
 clear(app){ if(!cur||cur.id!==app||cur.ro)return; Object.keys(cur.data).forEach(k=>{delete cur.data[k];cur.dirty.add(k)}); sched() }
};
window.PortalBridge=Bridge;
function setStatus(k){
  const el=$('#st');if(!el)return;
  const m={ok:['ok','✓ محفوظ'],wait:['wait','جارٍ الحفظ…'],bad:['bad','تعذّر الحفظ — سنعيد المحاولة'],ro:['ro','عرض فقط']};
  el.className='chip '+m[k][0];el.textContent=m[k][1];
}
function sched(){ if(!cur)return; setStatus('wait'); clearTimeout(cur.timer); cur.timer=setTimeout(flush,700) }
async function flush(){
  const c=cur; if(!c||c.ro||c.flushing||!c.dirty.size)return;
  c.flushing=true; clearTimeout(c.timer);
  const keys=[...c.dirty]; c.dirty.clear();
  const ch={}; keys.forEach(k=>ch[k]=(k in c.data)?c.data[k]:undefined);
  try{
    c.rev=await BE.saveApp(c.id,c.rev,ch,me.username);
    if(cur===c)setStatus(c.dirty.size?'wait':'ok');
  }catch(e){
    keys.forEach(k=>c.dirty.add(k));
    if(e&&e.code==='conflict'){ c.flushing=false; return conflict(c) }
    if(cur===c){setStatus('bad');c.timer=setTimeout(flush,5000)}
  }
  c.flushing=false;
  if(c.dirty.size&&cur===c)c.timer=setTimeout(flush,300);
}
function conflict(c){
  const d=$('#dlg');
  d.innerHTML=`<form method="dialog"><h3>تم تعديل هذه البيانات من مستخدم آخر</h3><p class="s" style="color:var(--mut)">قام شخص آخر بحفظ تغييرات في هذا البرنامج أثناء عملك. اختر ما تريد فعله بتعديلاتك التي لم تُحفظ بعد.</p>
  <div class="dact" style="flex-direction:column"><button class="btn or" value="mine">حفظ تعديلاتي فوق النسخة الجديدة</button><button class="btn ghost" value="theirs">تحميل النسخة الجديدة (أخسر تعديلاتي غير المحفوظة)</button></div></form>`;
  d.querySelector('form').onsubmit=async ev=>{
    const v=ev.submitter&&ev.submitter.value;
    if(v==='mine'){ try{const r=await BE.loadApp(c.id);c.rev=r.rev;flush()}catch(e){toast(errMsg(e))} }
    else { c.dirty.clear(); reloadApp() }
  };
  d.showModal();
}
async function closeApp(){
  if(!cur)return;
  const c=cur; clearTimeout(c.timer);
  if(c.dirty.size&&!c.ro){ try{ c.flushing=false; await flush() }catch(e){} }
  if(c.unsub)c.unsub(); cur=null;
}
async function reloadApp(){ const id=cur?cur.id:route.id; if(cur){ if(cur.unsub)cur.unsub(); clearTimeout(cur.timer); cur=null } openApp(id) }
function buildDoc(id,data,ro){
  let html=APPS_SRC[id];
  const shim='<script>window.PORTAL_LOGO='+JSON.stringify(LOGO)+';(function(){var D='+JSON.stringify(data).replace(/</g,'\\u003c')+',ID='+JSON.stringify(id)+';var B=function(){return parent.PortalBridge};'
   +'var st={getItem:function(k){return Object.prototype.hasOwnProperty.call(D,k)?D[k]:null},setItem:function(k,v){k=String(k);v=String(v);D[k]=v;try{B().set(ID,k,v)}catch(e){}},removeItem:function(k){delete D[k];try{B().del(ID,String(k))}catch(e){}},clear:function(){D={};try{B().clear(ID)}catch(e){}},key:function(i){return Object.keys(D)[i]||null}};'
   +'Object.defineProperty(st,"length",{get:function(){return Object.keys(D).length}});Object.defineProperty(window,"localStorage",{get:function(){return st},configurable:true});})()<\/script>';
  html=html.replace(/<head[^>]*>/i,m=>m+shim);
  if(ro){ html=html.replace(/<body[^>]*>/i,m=>m+'<div style="position:fixed;bottom:0;left:0;right:0;z-index:2147483647;background:#b8392b;color:#fff;text-align:center;padding:6px;font:700 13px Cairo,Tahoma,sans-serif;pointer-events:none">وضع العرض فقط — أي تعديل لن يتم حفظه</div>') }
  return html;
}
async function openApp(id){
  const meta=APPS.find(a=>a.id===id), lvl=levelOf(id); if(!meta||!lvl)return;

  route={v:'app',id};

  let r;

  if(route.v!=='app'||route.id!==id)return;

  cur={id,rev:r.rev,data:r.data,ro,dirty:new Set(),timer:null,flushing:false,unsub:null};

  });

  const fr=document.createElement('iframe'); fr.id='fr'; fr.title=meta.name;

    try{ const w=fr.contentWindow; w.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'){e.preventDefault();w.print()} }) }catch(e){}
  });
  fr.srcdoc=buildDoc(id,r.data,ro);
  $('#frameBox').innerHTML=''; $('#frameBox').appendChild(fr);
}

window.addEventListener('visibilitychange',()=>{ if(document.hidden&&cur)flush() });

    download('نسخة-احتياطية-شاملة-'+out.at.slice(0,10)+'.json',JSON.stringify(out));toast('تم تنزيل النسخة الاحتياطية');
  }catch(e){toast(errMsg(e))}

function importAll(file){
  const rd=new FileReader();
  rd.onload=async()=>{
    let o;try{o=JSON.parse(rd.result);if(o.portal!=='bina-portal'||!o.apps)throw 0}catch(e){toast('الملف ليس نسخة احتياطية شاملة من البوابة');return}
    if(!confirm('سيتم استبدال بيانات كل البرامج الموجودة في الملف. هل أنت متأكد؟'))return;
    try{
      for(const id of Object.keys(o.apps)){
        if(!APPS.some(a=>a.id===id))continue;
        const r=await BE.loadApp(id),ch={};
        Object.keys(r.data).forEach(k=>{if(!(k in o.apps[id]))ch[k]=undefined});
        Object.keys(o.apps[id]).forEach(k=>ch[k]=o.apps[id][k]);
        await BE.saveApp(id,r.rev,ch,me.username);
      }
      if(o.extra&&BE.extraImport)await BE.extraImport(o.extra);
      toast('تم استرجاع النسخة');
    }catch(e){toast(errMsg(e))}
  };
  rd.readAsText(file);
}
</script>
